<!doctype html><html><head><meta charset="utf-8"><style>

</style></head><body><div id="r"><div id="tarjeta"><img id="foto"></div><svg id="s" width="1080" height="1920" style="z-index:3"></svg></div>
<script src="datos.js"></script><script>
/* ---------- motor ---------- */
const R = document.getElementById('r'), S = document.getElementById('s'), TJ = document.getElementById('tarjeta'), FOTO = document.getElementById('foto');
const NS = 'http://www.w3.org/2000/svg', NEGRO = '#111', GRIS = '#9a9a9a';
const C = { raiz: '#C8372D', sacro: '#E06A1B', plexo: '#C99A00', corazon: '#1E7A46', garganta: '#1D7FD1', ojo: '#3F3FB5', corona: '#7A3FC4' };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, k) => a + (b - a) * k;
const P = (t, t0, d) => clamp((t - t0) / Math.max(d, 1e-3)), out = u => 1 - (1 - u) ** 3, io = u => u < .5 ? 4 * u ** 3 : 1 - (-2 * u + 2) ** 3 / 2;
const back = u => u <= 0 ? 0 : u >= 1 ? 1 : 1 + 2.7 * (u - 1) ** 3 + 1.7 * (u - 1) ** 2;
/* bloques: cada gráfico vive en su tramo de tablero (se crea dentro de bloque() y solo se ve ahí) */
let CUR_G = null, CUR_D = null; const BLQ = [];
const el = (cls, html) => { const e = document.createElement('div'); e.className = 'abs ' + cls; e.innerHTML = html; if (CUR_D) CUR_D.appendChild(e); else R.insertBefore(e, TJ); return e; };
function bloque(a, b, crear) {
  CUR_G = document.createElementNS('http://www.w3.org/2000/svg', 'g'); S.appendChild(CUR_G);
  CUR_D = document.createElement('div'); CUR_D.style.cssText = 'position:absolute;left:0;top:0'; R.insertBefore(CUR_D, TJ);
  const b0 = { a, b, g: CUR_G, d: CUR_D }; b0.fn = crear(a, b); CUR_G = CUR_D = null; BLQ.push(b0); }
const pon = (e, x, y, s = 1, o = 1, r = 0) => { e.style.opacity = clamp(o).toFixed(3); e.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) rotate(${r}deg) scale(${s.toFixed(4)})`; };
function path(d = '', c = NEGRO, w = 9, fill = 'none', svg = S) { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', fill); p.setAttribute('stroke', c); p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); p.setAttribute('pathLength', 1); p.style.strokeDasharray = 1; (svg === S && CUR_G ? CUR_G : svg).appendChild(p); return p; }
const dib = (p, u, o = 1) => { p.style.strokeDashoffset = (1 - clamp(u)).toFixed(4); p.style.opacity = u > 0 ? clamp(o).toFixed(3) : 0; if (p.getAttribute('fill') !== 'none') p.style.fillOpacity = clamp(u * 2 - 1) * o; };
const norm = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ%]/g, '');
/* tiempo (s del reel) en que empieza la palabra, buscándola desde ~desde */
function en(palabra, desde = 0) { const f = palabra.split(' ').map(norm);
  for (let k = 0; k < PAL.length; k++) { if (PAL[k][1] < desde - .6) continue; if (f.every((w, j) => PAL[k + j] && norm(PAL[k + j][0]) === w)) return PAL[k][1]; }
  console.error(`en: no encuentro «${palabra}» desde ${desde}`); return desde; }
const finDe = (frase, desde = 0) => { const a = en(frase, desde), k = PAL.findIndex(x => x[1] === a) + frase.split(' ').length - 1; return PAL[k][2]; };
/* efectos de sonido (herramientas/sonidos/usos.md): nunca dos a menos de 0,3 s */
const SFX = []; window.SFX = SFX;
function suena(t, id, vol = .3) { if (t < 0 || SFX.some(x => Math.abs(x[0] - t) < .3)) return; SFX.push([+t.toFixed(3), id, vol]); }
/* modo en t: 'tablero' o 'grande' (con su transición) */
const modoEn = t => { let m = MODOS[0][1], t0 = 0; for (const [a, b] of MODOS) if (t >= a) { m = b; t0 = a; } return { m, t0 }; };
const enTablero = t => modoEn(t).m === 'tablero';
/* cuánto se ve el tablero (1) o él en grande (0), con la transición de .35 s */
function kTablero(t) { const { m, t0 } = modoEn(t), k = io(P(t, t0, .35)); return m === 'tablero' ? (t0 === 0 ? 1 : k) : 1 - k; }

/* tramos de tablero [a, b] en orden: TABLEROS[0] es el gancho */
const TABLEROS = MODOS.map(([a, m], i) => [a, i + 1 < MODOS.length ? MODOS[i + 1][0] : DUR, m]).filter(x => x[2] === 'tablero').map(([a, b]) => [a, b]);

/* ---------- piezas comunes ---------- */
const AC = ACENTO;
/* texto grande que entra con un rebote en su palabra. 'palabra|color' = destacada */
function texto(frase, t0, o = {}) {
  const html = frase.split(' ').map(w => { const m = w.match(/^(.*?)\|([a-z]+)$/); return m ? `<span style="color:${m[2] === 'ac' ? AC : C[m[2]] || m[2]}">${m[1]}</span>` : w; }).join(' ');
  const e = el(o.m ? 'm' : 'big', html); e.style.fontSize = (o.tam || 96) + 'px'; e._t0 = t0; e._o = o;
  if (o.sonido !== false) suena(t0 - .05, (o.tam || 96) >= 100 ? 'golpe-corto' : 'tick-suave', (o.tam || 96) >= 100 ? .3 : .22);
  return e;
}
let KT = 1;   // cuánto se ve el tablero: todo lo de las escenas se apaga con él
function pt(e, t, x, y, o = 1, s = 1) { const k = back(P(t, e._t0 - .15, .4)); pon(e, x, y, s * lerp(.7, 1, k), Math.min(o, P(t, e._t0 - .15, .15) * 3) * KT); }
const pe = (e, t, x, y, s = 1) => pt(e, t, x, y, 1, s);
function pastilla(txt, t0, o = {}) { const e = el('pill', txt); if (o.ac) e.style.background = AC; if (o.tam) e.style.fontSize = o.tam + 'px'; e._t0 = t0; if (o.sonido !== false) suena(t0 - .05, 'pop', .3); return e; }
function emoji(ch, t0, tam = 110) { const e = el('emo', ch); e.style.fontSize = tam + 'px'; e._t0 = t0; suena(t0 - .05, 'pop', .3); return e; }
const circulo = (cx, cy, r) => `M${cx - r},${cy} A${r},${r} 0 1 1 ${cx + r},${cy} A${r},${r} 0 1 1 ${cx - r},${cy}`;
const cajaR = (x, y, w, h, r = 22) => `M${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} L${x + r},${y + h} Q${x},${y + h} ${x},${y + h - r} L${x},${y + r} Q${x},${y} ${x + r},${y} Z`;
const flecha = (x1, y1, x2, y2, k = 26) => { const a = Math.atan2(y2 - y1, x2 - x1); return `M${x1},${y1} L${x2},${y2} M${(x2 - k * Math.cos(a - .5)).toFixed(1)},${(y2 - k * Math.sin(a - .5)).toFixed(1)} L${x2},${y2} L${(x2 - k * Math.cos(a + .5)).toFixed(1)},${(y2 - k * Math.sin(a + .5)).toFixed(1)}`; };
const tick = (x, y, s = 1) => `M${x - 24 * s},${y} L${x - 6 * s},${y + 19 * s} L${x + 28 * s},${y - 24 * s}`;
const cruz = (x, y, s = 1) => `M${x - 20 * s},${y - 20 * s} L${x + 20 * s},${y + 20 * s} M${x + 20 * s},${y - 20 * s} L${x - 20 * s},${y + 20 * s}`;
const onda = (x1, x2, y, A, fase, k = 5) => { let d = ''; for (let i = 0; i <= 60; i++) { const x = lerp(x1, x2, i / 60); d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + (y + A * Math.sin(i / 60 * Math.PI * 2 * k + fase)).toFixed(1) + ' '; } return d; };
/* barra horizontal (negro frente al acento) */
function barra(color = NEGRO) { return { fondo: path('', '#ececec', 44), b: path('', color, 44) }; }
function pintarBarra(b, t, t0, x, y, w, v, o = 1) { b.fondo.setAttribute('d', `M${x},${y} L${x + w},${y}`); dib(b.fondo, 1 * (t > t0 - .3), o);
  const vv = v * out(P(t, t0, .7)); b.b.setAttribute('d', `M${x},${y} L${(x + Math.max(1, w * vv)).toFixed(1)},${y}`); dib(b.b, t > t0 ? 1 : 0, o); }
/* stickman sencillo de una pieza (x, y = suelo); brazos: 0 caídos … 1 arriba */
function stickman(color = NEGRO) { return { cab: path('', color, 8), cuerpo: path('', color, 8) }; }
function pintarStick(f, t, t0, x, y, s = 1, brazos = 0, o = 1) {
  const hy = y - 330 * s, a = lerp(.25, 2.6, brazos), L = 110 * s, hx = 0;
  f.cab.setAttribute('d', circulo(x, hy - 48 * s, 42 * s));
  const hom = [x, hy + 10 * s], cad = [x, y - 150 * s];
  f.cuerpo.setAttribute('d', `M${x - Math.sin(a) * L},${hom[1] + Math.cos(a) * L} L${hom[0]},${hom[1]} L${x + Math.sin(a) * L},${hom[1] + Math.cos(a) * L} M${hom[0]},${hom[1] - 4 * s} L${cad[0]},${cad[1]} M${x - 45 * s},${y} L${cad[0]},${cad[1]} L${x + 45 * s},${y}`);
  dib(f.cab, out(P(t, t0, .3)), o); dib(f.cuerpo, out(P(t, t0 + .15, .4)), o);
  return { cabeza: { x, y: hy - 48 * s }, pecho: { x, y: hy + 60 * s } };
}
/* silueta grande del boceto de Abel (energía y cuerpo); x, y = pies; centros como en la pizarra */
const MITAD = [[[-30, 128], [-52, 140], [-62, 162]], [[-76, 205], [-86, 300], [-86, 398]], [[-86, 432], [-60, 436], [-58, 404]],
  [[-56, 330], [-50, 262], [-44, 222]], [[-44, 300], [-46, 362], [-44, 424]], [[-48, 505], [-50, 585], [-46, 662]],
  [[-44, 694], [-14, 694], [-12, 662]], [[-10, 592], [-8, 524], [0, 466]]];
function _silD(x, y, s) { const f = ([a, b]) => `${(x + a * s).toFixed(1)},${(y - 694 * s + b * s).toFixed(1)}`, m = ([a, b]) => [-a, b], ini = [-13, 122];
  let d = `M${f(ini)} `; MITAD.forEach(([a, b, c]) => d += `C${f(a)} ${f(b)} ${f(c)} `);
  for (let i = MITAD.length - 1; i >= 0; i--) { const [a, b] = MITAD[i]; d += `C${f(m(b))} ${f(m(a))} ${f(m(i ? MITAD[i - 1][2] : ini))} `; } return d; }
const CENTROS = { corona: -18, ojo: 56, garganta: 140, corazon: 224, plexo: 306, sacro: 384, raiz: 446 };
function silueta(color = NEGRO) { return { cab: path('', color, 7), cu: path('', color, 7) }; }
function pintarSilueta(sl, t, t0, x, y, s = 1, o = 1) {
  sl.cab.setAttribute('d', `M${x - 40 * s},${y - 694 * s + 58 * s} C${x - 40 * s},${y - 694 * s + 22 * s} ${x - 18 * s},${y - 690 * s} ${x + 2 * s},${y - 690 * s} C${x + 24 * s},${y - 690 * s} ${x + 40 * s},${y - 668 * s} ${x + 40 * s},${y - 634 * s} C${x + 40 * s},${y - 602 * s} ${x + 22 * s},${y - 582 * s} ${x},${y - 582 * s} C${x - 22 * s},${y - 582 * s} ${x - 40 * s},${y - 600 * s} ${x - 40 * s},${y - 636 * s} Z`);
  sl.cu.setAttribute('d', _silD(x, y, s)); dib(sl.cab, out(P(t, t0, .4)), o); dib(sl.cu, out(P(t, t0 + .2, .9)), o);
  return c => ({ x, y: y - 694 * s + CENTROS[c] * s });
}

/* ---------- F4: él a pantalla completa (centrado en su cara por reel_tablero.py) con zooms suaves ---------- */
const zoomEn = t => { let z = 1, zp = 1, t0 = 0, suave = 0;                 // salto 1,00/1,08 en los cortes; suave (0,6 s) dentro de un plano largo
  for (const [a, zz, sv] of CORTES) if (t >= a) { zp = z; z = zz; t0 = a; suave = sv; }
  const zb = suave ? lerp(zp, z, io(P(t, t0, .6))) : z; return zb * (1 + .025 * P(t, t0, 5)); };
function pintarTarjeta(t) { FOTO.style.transform = `scale(${zoomEn(t).toFixed(4)})`; return { k: 1 }; }
/* título-gancho arriba (serif limpia) y apartados que lo sustituyen */
const pintaColor = (e, c) => { if (c) { e.style.color = c.color; e.style.textShadow = c.sombra; } };
const TIT = el('serif', TITULO.join('<br>')); pintaColor(TIT, COLORES.tit); TIT.style.fontSize = '72px'; TIT.style.width = '980px'; TIT.style.whiteSpace = 'normal';
const APS = (typeof APARTADOS !== 'undefined' ? APARTADOS : []).map(([txt, frase, desde]) => { const e = el('serif', txt); e.style.fontSize = '64px'; e.style.width = '980px'; e.style.whiteSpace = 'normal'; pintaColor(e, COLORES.tit); e._t0 = en(frase, desde) - .1; suena(e._t0, 'tick-suave', .22); return e; });
const FIN_TIT = APS.length ? APS[0]._t0 : TITULO_HASTA;
function pintarTitulos(t) {
  pon(TIT, 540, 250, 1 + .02 * (1 - P(t, 0, .4)), Math.min(P(t, -.1, .3) * 3, 1 - P(t, FIN_TIT - .2, .25)));
  APS.forEach((e, i) => { const fin = i + 1 < APS.length ? APS[i + 1]._t0 : 1e9; pon(e, 540, 250, 1, Math.min(P(t, e._t0, .25), 1 - P(t, fin - .2, .2))); });
}
/* imágenes: una sola cada vez (o el collage del gancho), abajo-centro, entran con un pequeño salto */
const FOTOS = [];
function imagen(src, t0, t1, o = {}) { const d = document.createElement('div'), im = document.createElement('div'); d.className = 'foto4'; d.appendChild(im);
  Object.assign(im.style, { position: 'absolute', inset: '0', backgroundImage: `url(${src})`, backgroundSize: 'cover', backgroundPosition: o.pos || 'center' }); const w = o.w || 620, h = o.h || 440; Object.assign(d.style, { width: w + 'px', height: h + 'px' });
  R.appendChild(d); const f = { d, im, t0, t1, w, h, x: o.x ?? 540, y: o.y ?? 1440 }; FOTOS.push(f); suena(t0, 'pop', .28); return f; }
function collage(srcs, t0, t1, o = {}) { const n = srcs.length, gap = 18, w = Math.floor(((o.ancho || 960) - gap * (n - 1)) / n), h = o.h || Math.round(w * 1.15);
  return srcs.map((s, i) => { const [src, pos] = Array.isArray(s) ? s : [s]; return imagen(src, t0 + i * .12, t1, { w, h, pos, x: 540 - (o.ancho || 960) / 2 + w / 2 + i * (w + gap), y: o.y ?? 1440 }); }); }
let _finFotos = false;
function finFotos() { const ini = [...new Set(FOTOS.map(f => f.t0))].sort((a, b) => a - b);   // mínimo 4,5 s en pantalla, salvo que entre la siguiente
  FOTOS.forEach(f => { const sig = ini.find(x => x > f.t0 + .3) ?? 1e9; f.t1 = Math.min(Math.max(f.t1, f.t0 + 4.5), sig - .05, DUR - .1); }); _finFotos = true; }
function pintarFotos(t) { if (!_finFotos) finFotos(); FOTOS.forEach((f, n) => { const k = back(P(t, f.t0 - .05, .45)), e = out(P(t, f.t0 - .05, .5)), o = Math.min(P(t, f.t0 - .05, .15) * 3, 1 - P(t, f.t1 - .15, .2));
  f.d.style.display = t > f.t0 - .1 && t < f.t1 + .1 ? '' : 'none'; f.d.style.filter = `blur(${(8 * (1 - e)).toFixed(2)}px)`;
  const fl = 6 * Math.sin((t - f.t0) * 1.3 + n), gi = (n % 2 ? 3 : -3) * (1 - e);
  f.d.style.opacity = clamp(o).toFixed(3); f.d.style.transform = `translate(${f.x - f.w / 2}px,${(f.y - f.h / 2 + 50 * (1 - e) + fl).toFixed(1)}px) rotate(${gi.toFixed(2)}deg) scale(${lerp(.8, 1, k).toFixed(4)})`;
  f.im.style.transform = `scale(${(1 + .06 * P(t, f.t0, f.t1 - f.t0)).toFixed(4)})`; }); }
/* cierre: palabra para comentar */
function cta(palabra, t0, encima = 'comenta') { const a = el('serif', encima), b = el('serif', palabra); a.style.fontSize = '52px'; b.style.fontSize = '120px'; a._t0 = b._t0 = t0; suena(t0, 'golpe-corto', .3);
  BLQ.push({ a: t0, b: DUR, g: document.createElementNS(NS, 'g'), d: document.createElement('div'), fn: t => { pon(a, 540, 1180, 1, P(t, t0, .25)); pon(b, 540, 1290, lerp(.8, 1, back(P(t, t0, .4))), P(t, t0, .2)); } }); }
/* ---------- subtítulos: 1–2 palabras; negro sobre el tablero, blanco sobre él ---------- */
const SUB = el('', ''); SUB.id = 'sub';
const BLOQUES = []; for (let i = 0; i < PAL.length;) { const w = PAL[i][0], n = PAL[i + 1]; const dos = n && (norm(w).length <= 3 || norm(n[0]).length <= 2) && n[1] - PAL[i][2] < .25;
  BLOQUES.push([dos ? w + ' ' + n[0] : w, PAL[i][1]]); i += dos ? 2 : 1; }
function pintarSub(t, k) {
  const b = [...BLOQUES].reverse().find(x => x[1] <= t + .03); SUB.textContent = b ? b[0].replace(/^~/, '') : '';
  const s = 1 + .06 * (1 - P(t, b ? b[1] : 0, .12)); SUB.className = 'abs serif'; SUB.style.fontSize = '58px'; pintaColor(SUB, COLORES.sub);
  pon(SUB, 540, 1190, s, b && !(typeof CTA_T !== 'undefined' && t > CTA_T - .1) ? 1 : 0);
}
/* ---------- el gráfico de cada reel (escenas.js) pinta solo con el tablero a la vista ---------- */
let ESC = () => {};
window.cargarFoto = i => new Promise(res => { FOTO.onload = res; FOTO.onerror = res; FOTO.src = `frames/${String(i + 1).padStart(5, '0')}.jpg`; });
window.pintar = t => {
  const { k } = pintarTarjeta(t);
  pintarTitulos(t); pintarFotos(t); KT = 1;
  for (const q of BLQ) { const v = t >= q.a - .1 && t <= q.b + .45; q.g.style.display = q.d.style.display = v ? '' : 'none'; if (v) q.fn(t); }

};
</script><script src="escenas.js"></script><script>
document.fonts.load('800 20px M').then(() => document.fonts.load('600 20px M')).then(async () => { await window.cargarFoto(0); window.pintar(0); document.title = 'listo'; });
</script></body></html>
