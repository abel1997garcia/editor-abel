<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Animación con voz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:'Outfit';font-weight:400;font-display:block;src:url(assets/fonts/outfit-400.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:500;font-display:block;src:url(assets/fonts/outfit-500.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:600;font-display:block;src:url(assets/fonts/outfit-600.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:700;font-display:block;src:url(assets/fonts/outfit-700.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:800;font-display:block;src:url(assets/fonts/outfit-800.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:block;src:url(assets/fonts/jbmono-400.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-display:block;src:url(assets/fonts/jbmono-500.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:600;font-display:block;src:url(assets/fonts/jbmono-600.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:300 700;font-display:block;src:url(assets/fonts/grotesk.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-weight:400;font-style:normal;font-display:block;src:url(assets/fonts/serif-400.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-weight:400;font-style:italic;font-display:block;src:url(assets/fonts/serif-400i.woff2) format('woff2')}

/* =====================================================================
   PALETA: base oscura del canal + un color por bando.
   .lado-a / .lado-b / .lado-n definen --c (color), --rgb (el mismo en r,g,b), --c2 (claro) y --c3 (muy claro).
   Cambia los valores por los colores de marca de lo que se compare (references/diseno.md).
   ===================================================================== */
:root{
  --bg:#0a0c10; --text:#eef1f7; --text2:#d5dae4; --muted:#98a1b3; --label:#8d97ab;
  --gold:#E9C46A; --green:#3ddc84; --red:#ec6a5e;
  --grad1:#E8906F; --grad2:#86A3FF;                       /* degradado de la palabra clave del título */
  --card-b:#252932; --chip-bg:#12151c; --chip-b:#2a2f3a;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Outfit',system-ui,sans-serif;
}
.lado-a{--c:#D97757;--rgb:217,119,87;--c2:#EE9A7A;--c3:#F4B79E}      /* ej.: Claude / Anthropic */
.lado-b{--c:#7C9CFF;--rgb:124,156,255;--c2:#A5BAFF;--c3:#C8D5FF}     /* ej.: OpenAI */
.lado-n{--c:#3e6ef2;--rgb:62,110,242;--c2:#6f8ff0;--c3:#a8bcfe}      /* neutro: azul del canal */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050608;overflow:hidden}
#viewport{position:absolute;left:0;right:0;top:0;bottom:56px;display:flex;align-items:center;justify-content:center}
body.render #viewport{bottom:0;align-items:flex-start;justify-content:flex-start}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:var(--sans);color:var(--text);flex:none}

/* capas, de abajo arriba: la sala (grabación) · fondo de la animación · mundo de detrás · la persona · mundo de delante.
   Sin grabación (modos audio y cara) solo se ven #fondo y los dos mundos: igual que siempre. */
#capaVideo,#capaPersona{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none}
#capaVideo canvas,#capaPersona canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;transform-origin:0 0}
#fondo{position:absolute;inset:0;background:var(--bg);overflow:hidden}
#espacio{position:absolute;left:0;top:0;width:100%;height:100%;display:none}
#destello{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 70% 70% at 50% 45%,#fff,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 100%)}

/* fondo */
#grid{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(160,176,214,.15) 1.3px,transparent 1.9px);background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 48%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at 50% 48%,#000 30%,transparent 100%)}
.glow{position:absolute;left:0;top:0;width:1500px;height:1500px;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--rgb),.22),rgba(var(--rgb),.065) 52%,transparent 100%)}
#glowN{--rgb:78,108,220}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse 85% 82% at 50% 50%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
#noise{position:absolute;inset:0;opacity:.04;pointer-events:none}
#world,#worldF{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#wires{position:absolute;left:0;top:0;z-index:2;overflow:visible}

.L{position:absolute;left:0;top:0;visibility:hidden}
.z1{z-index:1}.z2{z-index:2}.z3{z-index:3}.z4{z-index:4}.z5{z-index:5}.z6{z-index:6}.z7{z-index:7}.z8{z-index:8}

/* títulos */
.eyebrow{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:.22em;color:var(--label);white-space:nowrap}
.title{font-family:var(--display,var(--sans));font-weight:var(--display-peso,800);font-size:106px;letter-spacing:-.03em;line-height:1.08;white-space:nowrap;color:var(--text)}
.title .ch{display:inline-block}
.title .ch.grad{color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(90deg,var(--grad1),var(--grad2))}
.uline{width:150px;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--grad1),var(--grad2))}
.caret-i{display:inline-block;width:.55em;height:1em;margin-left:3px;vertical-align:-4px;background:#aab6d3;opacity:.85}

/* chip de cabecera: texto que se escribe al ritmo de la voz */
.chip{display:flex;align-items:center;gap:16px;height:72px;padding:0 32px 0 26px;border-radius:999px;background:var(--chip-bg);border:1.5px solid var(--chip-b);
  font-family:var(--mono);font-size:30px;font-weight:500;color:#dfe4ee;white-space:nowrap;box-shadow:0 20px 50px -24px rgba(0,0,0,.8)}
.chip .ic{width:32px;height:32px;color:#b7c1da;display:flex;flex:none}
.chip .tx{position:relative;display:flex;align-items:center}
.chip .strike{position:absolute;left:-6px;right:-6px;top:50%;height:3px;margin-top:-1px;border-radius:2px;background:#ec8a70;transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 10px rgba(236,138,112,.6)}

/* tarjeta de herramienta/modelo: logo + empresa + familia + nombre grande */
.mcard{width:500px;height:300px;border-radius:calc(var(--panel-k,1) * 30px);background:linear-gradient(180deg,#15171e,#0d0f14);border:1.5px solid var(--card-b);box-shadow:0 44px 90px -40px rgba(0,0,0,.9)}
.mcard .hi{position:absolute;inset:-1.5px;border-radius:30px;border:1.5px solid rgba(var(--rgb),.85);
  background:linear-gradient(160deg,rgba(var(--rgb),.17),rgba(var(--rgb),.035) 62%);
  box-shadow:0 0 0 1px rgba(var(--rgb),.22),0 36px 100px -30px rgba(var(--rgb),.7);opacity:0}
.mcard .ltile{position:absolute;left:36px;top:36px;width:88px;height:88px;border-radius:24px;background:#0b0c10;border:1.5px solid rgba(var(--rgb),.5);
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px -16px rgba(var(--rgb),.7);color:var(--c3)}
.mcard .ltile img{width:54px;height:54px;object-fit:contain;display:block}
.mcard .co{position:absolute;right:38px;top:66px;font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:.16em;color:var(--c3)}
.mcard .fam{position:absolute;left:38px;top:150px;font-size:34px;font-weight:500;color:#9aa3b5;white-space:nowrap}
.mcard .name{position:absolute;left:35px;top:190px;font-family:var(--display,var(--sans));font-size:84px;font-weight:var(--display-peso,800);letter-spacing:-.03em;line-height:1;color:#f3f5fa;white-space:nowrap;display:flex}
.mcard .name span{display:inline-block}
.mcard .ver{color:var(--c2);margin-left:.2em}

/* nodo de flujo (132x132): caja con icono o logo y etiqueta debajo; el hueco punteado con "+" se rellena */
.nodo{width:132px;height:132px}
.nodo .caja{position:absolute;inset:0;border-radius:32px;background:#0f1117;border:1.5px solid rgba(var(--rgb),.5);display:flex;align-items:center;justify-content:center;
  color:var(--c3);box-shadow:0 20px 50px -20px rgba(var(--rgb),.7)}
.nodo .hueco{position:absolute;inset:0;border-radius:32px;border:2px dashed #3d4556;display:flex;align-items:center;justify-content:center;color:#4f596d}
.nodo .hi{position:absolute;inset:-1.5px;border-radius:32px;border:1.5px solid rgba(var(--rgb),.9);box-shadow:0 0 0 1px rgba(var(--rgb),.25),0 24px 70px -20px rgba(var(--rgb),.8);opacity:0}
.nodo .lbl{position:absolute;left:50%;top:150px;transform:translateX(-50%);font-family:var(--mono);font-size:24px;font-weight:500;color:var(--text2);white-space:nowrap}

/* insignia redonda: "VS" o "=" */
.badge{width:74px;height:74px;border-radius:50%;background:#12151c;border:1.5px solid #343a47;box-shadow:0 16px 40px -14px rgba(0,0,0,.9)}
.badge > *{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.badge .vs{font-weight:800;font-size:28px;color:#f1f3f8;letter-spacing:.02em}
.badge .eq{color:#c3cad8}

/* barras (precios, métricas) */
.track{width:250px;border-radius:22px 22px 6px 6px;border:1.5px dashed #394156;background:rgba(255,255,255,.012)}
.bar{width:250px;border-radius:22px 22px 6px 6px;overflow:hidden;background:linear-gradient(180deg,var(--c2),rgba(var(--rgb),.75));box-shadow:0 30px 80px -30px rgba(var(--rgb),.8)}
.bar .price{position:absolute;left:0;right:0;top:24px;text-align:center;font-family:var(--display,var(--sans));font-weight:var(--display-peso,800);font-size:52px;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.bar .pcap{position:absolute;left:0;right:0;top:88px;text-align:center;font-family:var(--mono);font-size:19px;color:rgba(255,255,255,.85);letter-spacing:.06em;white-space:nowrap}
.bar .mark{position:absolute;left:0;right:0;border-top:2.5px dashed rgba(255,255,255,.8);opacity:0}
.bar .shine{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);opacity:0}
.baseline{height:2px;border-radius:1px;background:#2f3544}
.nota{height:62px;padding:0 28px 0 24px;border-radius:999px;background:#0d0f14;border:1.5px solid #5a6276;display:flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:29px;font-weight:500;color:#eef1f7;white-space:nowrap;box-shadow:0 14px 34px -14px rgba(0,0,0,.9)}
.nota b{font-family:var(--display,var(--sans));font-weight:var(--display-peso,800);font-size:40px;color:var(--c2)}
.pulse{border-style:solid}

/* intro con cara: en la previsualización, los planos de cara muestran la grabación (no sale en el render) */
#cara{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;z-index:50;display:none;background:#000}
#planoTag{position:absolute;right:18px;top:14px;z-index:60;font-family:var(--mono);font-size:18px;color:#fff;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px;display:none}
body.render #cara, body.render #planoTag{display:none !important}

/* controles de previsualización (no salen en el render) */
#controls{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#0a0c10;border-top:1px solid #1e2129;
  font-family:var(--mono);color:var(--muted);font-size:13px}
#controls button{width:38px;height:34px;border-radius:8px;border:1px solid #2b303d;background:#141a2c;color:#cfdbff;font-size:15px;cursor:pointer}
#controls input{flex:1;accent-color:#7C9CFF}
#controls .t{min-width:110px;text-align:right}
body.render #controls{display:none}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="capaVideo"><canvas id="cv"></canvas></div>
    <div id="fondo">
      <canvas id="espacio"></canvas>
      <div id="grid"></div>
      <div id="glowN" class="glow"></div>
      <div id="glowA" class="glow lado-a"></div>
      <div id="glowB" class="glow lado-b"></div>
    </div>
    <div id="world">
      <svg id="wires" width="1920" height="1080" viewBox="0 0 1920 1080">
        <defs><radialGradient id="dotHalo"><stop offset="0" stop-color="#9db4ff" stop-opacity=".65"/><stop offset="1" stop-color="#9db4ff" stop-opacity="0"/></radialGradient></defs>
        <g id="wiresG"></g><g id="dotsG"></g>
      </svg>
    </div>
    <div id="capaPersona"><canvas id="cp"></canvas></div>
    <div id="worldF"></div>
    <div id="vignette"></div>
    <div id="noise"></div>
    <div id="destello"></div>
    <video id="cara" muted playsinline preload="auto"></video>
    <div id="planoTag"></div>
  </div>
</div>
<div id="controls">
  <button id="play" title="Reproducir / pausa (espacio)">▶</button>
  <input id="scrub" type="range" min="0" max="10" step="0.01" value="0">
  <span class="t" id="tlabel">0.00 s</span>
</div>
<audio id="audio" preload="auto"></audio>

<script>
'use strict';
/* =====================================================================
   Motor de animación: cada fotograma es una función pura de t (segundos).
   render(t) coloca todo; render.mjs captura t = fotograma / FPS y ffmpeg añade la voz.
   Nada depende del fotograma anterior: se puede renderizar en paralelo y saltar a cualquier t.
   ===================================================================== */
const CONFIG = { dur: 725.7, audio: 'assets/audio/voz.wav', ancho: 1920, alto: 1080, montaje: true, capas: false };   // «anim.py nuevo» rellena dur y audio; montaje: true en intros con cara (nuevo --video); capas: true en los modos capas y combinado
/* Estilo elegido al empezar (references/estilos.md). Lo escribe «anim.py nuevo» y se cambia con «anim.py estilo».
   modo: audio | cara | capas | combinado · tema: oscuro | profundidad · acento: color del tema profundidad
   sonido: voz | efectos | musica · musica: clave de <skill>/musica/musica.json · densidad: sobria | media | espectaculo */
const ESTILO = {"modo": "cara", "tema": "oscuro", "fondo": "cortina", "acabado": "cristal", "tipo": "outfit", "acento": "#3E6EF2", "sonido": "efectos", "musica": "intro-tambores", "densidad": "media", "subtitulos": false, "camaraEnMano": false};
const CX = CONFIG.ancho / 2, CY = CONFIG.alto / 2;
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
if (RENDER) document.body.classList.add('render');

/* ---------- Guion: inicio de cada palabra clave (de trabajo/tiempos.json, en segundos) ----------
   Un visual entra 0,02–0,05 s antes de su palabra. Ejemplo: T.opus = 4.64 -> la tarjeta arranca en T.opus - .04 */
const T = {};

window.__T = T;   // tools/comprobar.mjs --palabras saca un fotograma del MP4 en cada uno
window.__ESTILO = ESTILO;

/* ---------- efectos de sonido (references/sonido.md) ----------
   sfx(t, 'nombre', {vol, pan}): el golpe del sonido cae en t (segundos del vídeo). Se declaran UNA vez, fuera de
   render(): arriba, junto a las piezas, o en layout() si dependen de las ventanas V del montaje. Nombres: los de
   <skill>/sonidos/sonidos.json ('aire', 'tick', 'golpe', 'nota'...). vol 1 = nivel por defecto (0,5 ≈ −6 dB).
   Solo suenan si ESTILO.sonido es 'efectos' o 'musica'; la mezcla la hace «anim.py sonido» (la lanzan render y montar). */
const SFX = [];
function sfx(t, id, o = {}) {
  if (t == null || !isFinite(t)) { console.error(`sfx('${id}'): tiempo no válido`); return; }
  SFX.push({ t: +(+t).toFixed(4), id, vol: o.vol ?? 1, pan: o.pan ?? 0 });
}
window.__SFX = SFX;

/* ---------- utilidades ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: p => p,
  out2: p => 1 - (1 - p) * (1 - p),
  out3: p => 1 - Math.pow(1 - p, 3),
  out4: p => 1 - Math.pow(1 - p, 4),
  in2: p => p * p,
  in3: p => p * p * p,
  io3: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  io4: p => p < .5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2,
  ioSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  back: p => { const s = 1.70158; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); },
  spring: p => p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(10.5 * p),
};
/* progreso 0..1 de una animación que empieza en t0 y dura d, con curva e */
const P = (t, t0, d, e = E.out3) => e(clamp((t - t0) / d));
/* 0 -> 1 -> 0 (seno) entre t0 y t0+d: golpes de escala, parpadeos */
const bump = (t, t0, d) => (t < t0 || t > t0 + d) ? 0 : Math.sin(Math.PI * (t - t0) / d);
/* destello: sube en rise s y cae exponencialmente */
const flash = (t, t0, rise = .08, decay = 3.2) => t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.exp(-(t - t0 - rise) * decay);
const blink = (t, hz = 2.2) => (Math.floor(t * hz * 2) % 2 === 0) ? 1 : 0;
/* muelle amortiguado: respuesta a un escalón (0 -> 1, con rebote) y a un golpe (0 -> ±1 -> 0) */
function step(tau, w = 9, z = .35) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
function impulse(tau, w = 10, z = .3) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return Math.exp(-z * w * tau) * Math.sin(wd * tau);
}
/* fotogramas clave: [[t, {props}, curva], ...]. norm() rellena lo que falte con el fotograma anterior
   (KF solo interpola las propiedades presentes en cada fotograma: sin norm() se pierden). */
function norm(keys) {
  let prev = {};
  return keys.map(([t, v, e]) => { const full = { ...prev, ...v }; prev = full; return e ? [t, full, e] : [t, full]; });
}
function KF(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e = E.io3] = keys[i], [t0, v0] = keys[i - 1];
    if (t < t1) {
      const p = e(clamp((t - t0) / (t1 - t0))), o = {};
      for (const k in v1) o[k] = lerp(v0[k] ?? v1[k], v1[k], p);
      return o;
    }
  }
  return keys[keys.length - 1][1];
}
const mix = (a, b, p) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], p))).join(',')})`;

const $ = id => document.getElementById(id);
const STAGE = $('stage'), WORLD = $('world'), WORLDF = $('worldF'), WIRES = $('wiresG'), DOTS = $('dotsG');
/* WORLD = mundo de la animación (en los modos con grabación, DETRÁS de la persona); WORLDF = DELANTE de la persona.
   Los dos llevan la misma cámara. mk(tag, cls, WORLDF) crea una pieza delante; sin grabación da igual dónde esté. */
const SVGNS = 'http://www.w3.org/2000/svg';

function mk(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || WORLD).appendChild(e);
  return e;
}

/* coloca un elemento de primer nivel. x,y = punto de anclaje (por defecto el centro; ax/ay en %)
   o = opacidad, s/sx/sy = escala, r = giro, ry / rx = giro 3D en Y / en X (volteo de carta, inclinación de un panel
   de cristal: rx 6, ry -9), per = perspectiva (px), b = desenfoque px, g = escala de grises 0..1, br = brillo.
   Con o ≈ 0 lo oculta (visibility hidden). */
function put(e, o) {
  const op = o.o ?? 1;
  if (!(op > 0.002)) { if (e._v !== 0) { e.style.visibility = 'hidden'; e.style.opacity = 0; e._v = 0; } return; }
  if (e._v !== 1) { e.style.visibility = 'visible'; e._v = 1; }
  const ax = o.ax ?? 50, ay = o.ay ?? 50;
  let tr = `translate(${o.x.toFixed(2)}px,${o.y.toFixed(2)}px) translate(${-ax}%,${-ay}%)`;
  if (o.ry || o.rx) tr += ` perspective(${o.per || 1600}px) rotateX(${(o.rx || 0).toFixed(3)}deg) rotateY(${(o.ry || 0).toFixed(3)}deg)`;
  if (o.r) tr += ` rotate(${o.r.toFixed(3)}deg)`;
  const s = o.s ?? 1, sx = (o.sx ?? 1) * s, sy = (o.sy ?? 1) * s;
  if (sx !== 1 || sy !== 1) tr += ` scale(${sx.toFixed(4)},${sy.toFixed(4)})`;

/* ---------- intro con cara (anim.py nuevo --video): planos de cara y planos de animación ----------
   edicion/montaje.json dice qué fotogramas del vídeo sin pausas son cara (la grabación) y cuáles animación a
   pantalla completa. Sin ese archivo todo es animación, como siempre. V.<id> = { a, b }: el tramo visible de cada
   plano de animación, en segundos. Cada escena se pinta dentro de su ventana (dentro(t, V.id)) y apaga todo fuera. */
let PLANOS = [], CERCA = { cx: 1920, y0: 0 }, FPS_M = 60, VERT = null;   // VERT: encuadre vertical (montaje.json -> "vertical")
const V = {};
async function cargarMontaje() {
  if (!CONFIG.montaje) return;
  try {
    const r = await fetch('edicion/montaje.json', { cache: 'no-store' });
    if (!r.ok) return;
    const m = await r.json();
    PLANOS = m.planos || []; CERCA = m.cerca || CERCA; FPS_M = m.fps || 60; VERT = m.vertical || null;
    for (const p of PLANOS) if (p.tipo === 'anim') V[p.id] = { a: p.f0 / FPS_M, b: p.f1 / FPS_M, asentar: p.asentar !== false };

/* ¿t cae en la ventana w? (con margen: al revisar un instante fuera del corte no se quedan piezas colgadas) */
const dentro = (t, w, pre = .2, post = .08) => !!w && t >= w.a - pre && t < w.b + post;

function planoEn(t) { const f = Math.floor(t * FPS_M + 1e-6); return PLANOS.find(p => f >= p.f0 && f < p.f1) || PLANOS[PLANOS.length - 1] || null; }

/* cámara = fotogramas clave CAMK y, en intros con cara, un asentamiento 1,06 -> 1 al entrar en cada plano de
   animación: acompaña el corte desde la cara (el primer fotograma nunca está quieto). Un plano que empieza sin
   corte (la grabación que se convierte en ficha, una cuchilla) lleva "asentar": false en montaje.json. */

/* posición en el mundo para que una pieza se vea fija en pantalla (x, y, escala s) aunque la cámara se mueva
   (rótulos que tienen que leerse mientras la cámara se acerca a otra cosa): put(el, { ...fijo(t, CX, 112, 1.2), o }) */
function fijo(t, x, y, s = 1) {
  const c = camara(t);
  return { x: (x - CX) / c.s + c.x, y: (y - CY) / c.s + c.y, s: s / c.s };
}

/* icon(nombre, tamaño, grosor) -> HTML del SVG. Con dibujable = true cada trazo lleva pathLength=1
   y se puede "dibujar" con drawStrokes(svg, progreso) (el svg es el elemento ya insertado). */
function icon(name, size, sw = 2, dibujable = false) {
  if (!ICON[name]) console.error('icono desconocido: ' + name);
  const inner = dibujable ? (ICON[name] || '').replace(/<(path|circle|rect|line|polyline|polygon|ellipse)\b/g, '<$1 pathLength="1"') : (ICON[name] || '');
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="display:block;overflow:visible">${inner}</svg>`;
}
/* dibuja los trazos de un SVG con pathLength=1. stagger = desfase entre trazos (0..1) */
function drawStrokes(svg, p, stagger = 0) {
  const parts = svg._parts || (svg._parts = [...svg.querySelectorAll('[pathLength]')]);
  const n = parts.length, span = 1 - (n - 1) * stagger;
  for (let i = 0; i < n; i++) {
    const q = stagger ? clamp((p - i * stagger) / span) : p;
    parts[i].style.strokeDasharray = q >= 1 ? 'none' : '1 2';
    parts[i].style.strokeDashoffset = (1 - q).toFixed(4);
    parts[i].style.opacity = q > 0.002 ? 1 : 0;
  }
}

let LOGOS = null;   // registro de logos.json, cargado al arrancar
const logo = (slug, size = 54) => {
  const f = LOGOS && LOGOS[slug] ? ` src="assets/logos/${LOGOS[slug].file.split('/').pop()}"` : '';
  return `<img data-logo="${slug}"${f} width="${size}" height="${size}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;display:block">`;
};

/* ---------- conectores discontinuos y paquetes que viajan por ellos ---------- */
class Wire {
  constructor(pts, o = {}) {
    this.el = document.createElementNS(SVGNS, 'path');
    this.el.setAttribute('fill', 'none');
    this.el.setAttribute('stroke', o.color || '#4a5266');
    this.el.setAttribute('stroke-width', o.width || 2);
    this.el.setAttribute('stroke-linecap', 'round');
    if (o.dash !== null) this.el.setAttribute('stroke-dasharray', o.dash || '7 9');
    if (!o.hidden) WIRES.appendChild(this.el);
    this.set(pts);
  }
  set(pts) {
    this.pts = pts; this.seg = []; this.L = 0;
    for (let i = 1; i < pts.length; i++) {
      const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      this.seg.push(l); this.L += l;
    }
  }
  at(f) {   // punto en la fracción f del recorrido
    let d = clamp(f) * this.L;
    for (let i = 0; i < this.seg.length; i++) {
      if (d <= this.seg[i] || i === this.seg.length - 1) {
        const p = this.seg[i] ? clamp(d / this.seg[i]) : 0, a = this.pts[i], b = this.pts[i + 1];
        return [lerp(a[0], b[0], p), lerp(a[1], b[1], p)];
      }
      d -= this.seg[i];
    }
  }
  sub(a, b) {
    const A0 = a * this.L, B0 = b * this.L, out = [];
    let acc = 0;
    for (let i = 0; i < this.seg.length; i++) {
      const s0 = acc, s1 = acc + this.seg[i]; acc = s1;
      if (s1 < A0 || s0 > B0 || !this.seg[i]) continue;
      const p0 = clamp((A0 - s0) / this.seg[i]), p1 = clamp((B0 - s0) / this.seg[i]);
      const a0 = this.pts[i], b0 = this.pts[i + 1];
      if (!out.length) out.push(`M${lerp(a0[0], b0[0], p0).toFixed(2)} ${lerp(a0[1], b0[1], p0).toFixed(2)}`);
      out.push(`L${lerp(a0[0], b0[0], p1).toFixed(2)} ${lerp(a0[1], b0[1], p1).toFixed(2)}`);
    }
    return out.join('');
  }
  /* dibuja el tramo [a,b] (fracciones 0..1). flow = desplazamiento de las rayas en px (sensación de flujo) */
  draw(a, b, op = 1, flow = 0) {
    if (b - a <= 0.0005 || op <= 0.002) { this.el.style.opacity = 0; this.el.setAttribute('d', ''); return; }
    this.el.setAttribute('d', this.sub(a, b));

function travel(dot, wire, t, t0, t1, rev = false, e = E.io3) {
  if (t < t0 || t > t1 + 0.14) { dot.hide(); return; }
  const p = e(clamp((t - t0) / (t1 - t0)));

const PULSES = [];

  const e = mk('div', 'L pulse z6');
  e.style.width = w + 'px'; e.style.height = h + 'px'; e.style.borderRadius = r + 'px';
  e.style.borderWidth = bw + 'px'; e.style.borderColor = `rgba(${rgb},.95)`;

/* anillo alrededor de una tarjeta que se mueve con fotogramas clave (se toma su posición en t0) */
const ringCard = (t0, keys, rgb, to = 1.16, dur = .8) => { const k = KF(t0, keys); pulse(t0, dur, k.x, k.y, 500 * k.s, 300 * k.s, 30 * k.s, rgb, to); };

/* ---------- título letra a letra (palabra clave con degradado) ---------- */
function letters(text, cls, gradWord) {
  const d = mk('div', cls);
  const g0 = gradWord ? text.indexOf(gradWord) : -1, g1 = g0 + (gradWord || '').length;
  d._ch = [...text].map((c, i) => {
    const s = document.createElement('span');
    s.className = 'ch' + (i >= g0 && i < g1 && g0 >= 0 ? ' grad' : '');
    s.textContent = c === ' ' ? ' ' : c;     // espacio duro: un espacio normal en inline-block desaparece
    d.appendChild(s); return s;

  const out = []; let w = 0, k = 0;
  for (const c of text) { if (c === ' ') { out.push(null); w++; k = 0; continue; } out.push((starts[w] ?? starts[starts.length - 1]) - lead + k * gap); k++; }

  d._ch.forEach((c, i) => {

  const g = d._ch.filter(c => c.classList.contains('grad'));

  const x0 = g[0].offsetLeft, W = g[g.length - 1].offsetLeft + g[g.length - 1].offsetWidth - x0;

COL.masc = C.plexo; COL.fem = C.ojo; COL.int = C.garganta;
const tarjetaVideo = (g, x, y, w, h) => trazo(g, cajaR(x - w / 2, y - h / 2, w, h, 18), { ancho: 6, fill: '#fff' });
const play = (g, x, y, r = 26) => trazo(g, `M${x - r * .5},${y - r * .7} L${x - r * .5},${y + r * .7} L${x + r * .7},${y} Z`, { ancho: 6, color: C.raiz, fill: C.raiz });
const fadeIn = (t, t0, d = .3) => P(t, t0 - .05, d, E.out3);
const ceja = (e, txt, color = NEGRO) => { const c = mk('div', 'ceja', e.div, txt); c.style.color = color; return c; };
const pintarCeja = (c, t, t0, x, y) => { c.style.opacity = fadeIn(t, t0); c.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`; };
const ver = (el, t, t0, t1 = 1e9) => pt(el, t, { o: t < t1 ? 1 : clamp(1 - (t - t1) / .25) });   // texto que se va

/* sol (energía masculina) y luna (femenina): se dibujan solos; los rayos del sol giran despacio */
function sol(e, color = C.plexo) { return { c: trazo(e.svg, '', { ancho: 7, color }), r: [0, 1, 2, 3, 4, 5, 6, 7].map(() => trazo(e.svg, '', { ancho: 7, color })) }; }
function pintarSol(s, t, t0, x, y, R = 70, o = 1) {
  forma(s.c, () => circulo(x, y, R)); dibujar(s.c, dib(t, t0, .45), o);
  s.r.forEach((r, i) => { const a = i * Math.PI / 4 + t * .25, r0 = R + 22, r1 = R + 58 + 6 * Math.sin(t * 4 + i);
    forma(r, () => linea(x + r0 * Math.cos(a), y + r0 * Math.sin(a), x + r1 * Math.cos(a), y + r1 * Math.sin(a), 0)); dibujar(r, dib(t, t0 + .3 + i * .04, .2), o); });
}
function luna(e, color = C.ojo) { return trazo(e.svg, '', { ancho: 7, color }); }
function pintarLuna(l, t, t0, x, y, R = 70, o = 1) {
  forma(l, () => `M${x + R * .35},${y - R} A${R},${R} 0 1 0 ${x + R * .35},${y + R} A${R * .78},${R * .78} 0 1 1 ${x + R * .35},${y - R} Z`); dibujar(l, dib(t, t0, .5), o);
}
/* diana (destino) */
function diana(e, color = C.ojo) { return [0, 1, 2].map(() => trazo(e.svg, '', { ancho: 7, color })); }
function pintarDiana(d, t, t0, x, y, R = 150, o = 1) { d.forEach((c, i) => { forma(c, () => circulo(x, y, R * (1 - i * .33))); dibujar(c, dib(t, t0 + i * .12, .4), o); }); }
/* falda triangular sobre un stickman (las mujeres de las historias) */
function vestido(e, color = C.ojo) { return trazo(e.svg, '', { ancho: 6, color, fill: '#fff' }); }
function pintarVestido(v, t, t0, st) { const c = st.cadera, s = st.s;
  forma(v, () => `M${c.x - 14 * s},${c.y - 90 * s} L${c.x - 80 * s},${c.y + 60 * s} L${c.x + 80 * s},${c.y + 60 * s} L${c.x + 14 * s},${c.y - 90 * s} Z`); dibujar(v, dib(t, t0, .35)); }
/* onda entre dos puntos (frecuencia) */
const onda = (x1, x2, y, A, fase, k = 5) => { let d = ''; for (let i = 0; i <= 60; i++) { const x = lerp(x1, x2, i / 60); d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + (y + A * Math.sin(i / 60 * Math.PI * 2 * k + fase)).toFixed(1) + ' '; } return d; };
/* columna de pasos con número */
function paso(e, n, frase, desde, o = {}) { return { n: texto(e, n, en(o.num || frase.replace(/\|[a-z]+/g, '').split(' ')[0], desde) - .05, { tam: o.tam || 72, ax: 50, sonido: false }), tx: X(e, frase, desde, { tam: o.tam || 72, ax: 0, ...o }) }; }
function pintarPaso(p, t, x, y, o = 1) { pt(p.n, t, { x, y, o }); pt(p.tx, t, { x: x + 70, y, o }); }

const CAMK = norm([[0, { x: CX, y: CY, s: 1 }]]);

/* =====================================================================
   ARRANQUE: tamaño, fuentes, logos, ruido; luego layout() y render(0)
   ===================================================================== */
function makeNoise() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), d = x.createImageData(256, 256);
  let s = 1234567;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0);
  $('noise').style.backgroundImage = `url(${c.toDataURL()})`;
}
async function cargarLogos() {
  let reg = {};
  try { const r = await fetch('assets/logos/logos.json', { cache: 'no-store' }); if (r.ok) reg = await r.json(); } catch (e) { /* sin logos */ }
  LOGOS = reg;
  for (const img of document.querySelectorAll('img[data-logo]')) {
    const k = img.dataset.logo, f = reg[k]?.file;
    img.src = 'assets/logos/' + (f ? f.split('/').pop() : `${k}.svg`);
  }
  await Promise.all([...document.images].map(i => i.decode().catch(() => console.error('logo sin cargar: ' + (i.dataset.logo || i.src)))));
}

/* --- previsualización con audio: node server.mjs -> http://127.0.0.1:5178/ (espacio, flechas; ?t=12.5 salta) --- */
if (!RENDER) {
  // sin voz (proyecto creado con --dur) la previsualización corre con un reloj que imita al <audio>
  const reloj = () => { let base = 0, t0 = 0, on = false; return {
    get currentTime() { return on ? base + (performance.now() - t0) / 1000 : base; },
    set currentTime(v) { base = v; t0 = performance.now(); },
    play() { t0 = performance.now(); on = true; }, pause() { base = this.currentTime; on = false; },
    get ended() { return this.currentTime >= CONFIG.dur; } }; };
  const audio = CONFIG.audio ? $('audio') : reloj(), btn = $('play'), scrub = $('scrub'), lab = $('tlabel');
  if (CONFIG.audio) audio.src = CONFIG.audio;
  scrub.max = CONFIG.dur;
  let playing = false, mezcla = '';
  // con efectos o música, si ya hay mezcla (anim.py sonido) se escucha la mezcla
  if (CONFIG.audio && ESTILO.sonido !== 'voz')
    fetch('assets/audio/mezcla.wav', { method: 'HEAD' }).then(r => { if (r.ok) { audio.src = 'assets/audio/mezcla.wav'; mezcla = ' · mezcla'; } }).catch(() => {});
  // intro con cara: en los planos de cara se ve la grabación sin pausas (proxy 720p) con el encuadre del montaje
  // (en los modos capas y combinado la grabación ya la pintan las capas: no hace falta el proxy)
  const cara = $('cara'), tag = $('planoTag');
  let conCara = false, SALTOS = [], FW = 1920, FH = 1080;
  window.__ready.then(() => {
    if (CAPAS.on) { CAPAS.alCargar = () => { if (!playing) render(+scrub.value); }; return; }
    conCara = PLANOS.some(p => p.tipo === 'cara');
    if (!conCara) return;
    cara.src = 'edicion/cara_proxy.mp4'; tag.style.display = 'block';
    fetch('edicion/cortes.json').then(r => r.json()).then(c => { SALTOS = c.tramos.map(x => x.edit_f0); }).catch(() => {});
    fetch('edicion/fuente.json').then(r => r.json()).then(f => { FW = f.ancho; FH = f.alto; }).catch(() => {});
  });
  const verCara = t => {
    if (!conCara) return;
    const p = planoEn(t);
    if (!p || p.tipo !== 'cara') { cara.style.display = 'none'; if (!cara.paused) cara.pause(); tag.textContent = p ? 'ANIM · ' + p.id : ''; return; }
    const f = Math.floor(t * FPS_M + 1e-6), k = SALTOS.filter(j => j > p.f0 && j <= f).length, zs = p.zooms || [1], z = zs[k % zs.length];
    const x0 = clamp(CERCA.cx - FW / z / 2, 0, FW - FW / z) * CONFIG.ancho / FW, y0 = clamp(CERCA.y0, 0, FH - FH / z) * CONFIG.alto / FH;
    cara.style.transformOrigin = '0 0';
    cara.style.transform = z === 1 ? 'none' : `translate(${(-x0 * z).toFixed(1)}px,${(-y0 * z).toFixed(1)}px) scale(${z})`;
    cara.style.display = 'block'; tag.textContent = `CARA · ${z}`;
    if (Math.abs(cara.currentTime - t) > .12) cara.currentTime = t;
    if (playing && cara.paused) cara.play().catch(() => {});
    if (!playing && !cara.paused) cara.pause();
  };
  const show = t => { prepararCapas(t); render(t); verCara(t); scrub.value = t; lab.textContent = `${t.toFixed(2)} / ${CONFIG.dur.toFixed(2)} s${mezcla}`; };
  const fit = () => { const vp = $('viewport'); const s = Math.min(vp.clientWidth / CONFIG.ancho, vp.clientHeight / CONFIG.alto); STAGE.style.transform = `scale(${s})`; STAGE.style.margin = `${(CONFIG.alto * s - CONFIG.alto) / 2}px ${(CONFIG.ancho * s - CONFIG.ancho) / 2}px`; };
  window.addEventListener('resize', fit); fit();
  const loop = () => { if (!playing) return; show(Math.min(audio.currentTime, CONFIG.dur)); if (audio.ended) { playing = false; btn.textContent = '▶'; } else requestAnimationFrame(loop); };
  const toggle = () => {
    if (playing) { audio.pause(); playing = false; btn.textContent = '▶'; return; }
    if (audio.currentTime >= CONFIG.dur - .05) audio.currentTime = 0;
    audio.play(); playing = true; btn.textContent = '❚❚'; loop();
  };
  btn.onclick = toggle;
  scrub.oninput = () => { audio.currentTime = +scrub.value; show(+scrub.value); };
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const d = (e.shiftKey ? .1 : 1) * (e.code === 'ArrowRight' ? 1 : -1); audio.currentTime = clamp(audio.currentTime + d, 0, CONFIG.dur); show(audio.currentTime); }
  });
  window.__ready.then(() => { if (Q.has('t')) audio.currentTime = +Q.get('t'); show(Q.has('t') ? +Q.get('t') : 0); });
}
