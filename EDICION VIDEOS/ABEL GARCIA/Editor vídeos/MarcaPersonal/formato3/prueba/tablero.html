<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(Montserrat-Variable.ttf);font-weight:100 900}
html,body{margin:0}
#r{position:relative;width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:M;
 background-image:radial-gradient(#e4e4e4 2.2px,transparent 2.2px);background-size:36px 36px}
.abs{position:absolute;left:0;top:0;transform-origin:center}
.pill{background:#111;color:#fff;font-weight:700;font-size:38px;padding:14px 32px;border-radius:999px;white-space:nowrap}
.pill.ac{background:#E06A1B}
.big{font-weight:800;letter-spacing:-.02em;white-space:nowrap;line-height:1}
.emo{font-family:'Segoe UI Emoji';font-size:96px;line-height:1}
#sombra{position:absolute;left:130px;top:1110px;width:820px;height:500px;border-radius:40px;box-shadow:0 18px 40px rgba(0,0,0,.2);background:#ddd}
svg{position:absolute;left:0;top:0}
</style></head><body><div id="r"><div id="sombra"></div><svg id="s" width="1080" height="1920"></svg></div>
<script src="palabras.js"></script><script>
/* Prueba F3 · tablero con motion graphics (mismo trozo que la prueba del dibujo a mano). t en s desde 500,30. */
const R = document.getElementById('r'), S = document.getElementById('s'), NS = 'http://www.w3.org/2000/svg', AC = '#E06A1B';
const en = w => { const p = PAL.find(x => x[0].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '') === w); return p ? p[1] : 99; };
const P = (t, t0, d) => Math.min(1, Math.max(0, (t - t0) / d)), out = u => 1 - (1 - u) ** 3, back = u => u === 0 ? 0 : 1 + 2.7 * (u - 1) ** 3 + 1.7 * (u - 1) ** 2;
const el = (cls, html) => { const e = document.createElement('div'); e.className = 'abs ' + cls; e.innerHTML = html; R.appendChild(e); return e; };
const pon = (e, x, y, s = 1, o = 1, r = 0) => { e.style.opacity = o; e.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s})`; };
const path = (d, c = '#111', w = 9) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', c); p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); p.setAttribute('pathLength', 1); p.style.strokeDasharray = 1; S.appendChild(p); return p; };
const dib = (p, u) => { p.style.strokeDashoffset = 1 - u; p.style.opacity = u > 0 ? 1 : 0; };
// piezas
const titulo = el('pill', 'Así te engancha la dopamina');
const movil = path('M250,470 Q250,430 290,430 L410,430 Q450,430 450,470 L450,800 Q450,840 410,840 L290,840 Q250,840 250,800 Z');
const lineas = [0, 1, 2, 3, 4, 5].map(() => path('', '#c9c9c9', 8));
const t5 = el('big', '5 min'), t1 = el('big', '1 hora'), tachon = path('M600,505 L880,490', '#9a9a9a', 10);
const hilo = path('', '#111', 5), anzuelo = path('', '#111', 8), dopa = el('pill ac', 'DOPAMINA'), tijeras = el('emo', '✂️');
const sub = el('big', ''); sub.style.fontSize = '104px'; sub.style.color = '#111';
const T = { scroll: en('scroll'), cinco: en('cinco'), acabas: en('acabas'), hora: en('hora'), engan: en('enganchado'), dopa: en('dopamina'), corta: en('corta') };
window.pintar = t => {
  pon(titulo, 540, 250, back(P(t, -.2, .45)), Math.min(1, P(t, -.2, .2) * 3));
  dib(movil, out(P(t, 0, .6)));
  // contenido que pasa sin parar desde «scroll»
  const v = Math.max(0, t - T.scroll + .15) * 260;
  lineas.forEach((l, i) => { const y = 470 + ((i * 60 - v) % 360 + 360) % 360; l.setAttribute('d', `M285,${y} L${i % 2 ? 380 : 415},${y}`); dib(l, P(t, .4 + i * .05, .2) * (y > 465 && y < 805 ? 1 : 0)); });
  // la palabra que cambia: 5 min → tachado → 1 hora
  const k5 = back(P(t, T.cinco - .1, .4)); pon(t5, 740, 500, k5, Math.min(1, P(t, T.cinco - .1, .15) * 3)); t5.style.fontSize = '110px';
  t5.style.color = t > T.acabas ? '#9a9a9a' : '#111'; dib(tachon, out(P(t, T.acabas, .3)));
  pon(t1, 740, 650, back(P(t, T.hora - .25, .45)), Math.min(1, P(t, T.hora - .25, .15) * 3), -3); t1.style.fontSize = '130px'; t1.style.color = AC;
  // el hilo baja y engancha el móvil; al cortar, la parte de arriba sube
  const baja = out(P(t, T.engan - .3, .5)), corte = out(P(t, T.corta, .5)), yc = 360;
  hilo.setAttribute('d', `M350,300 L350,${300 + 110 * baja}`); dib(hilo, baja > 0 ? 1 : 0);
  if (t > T.corta) hilo.setAttribute('d', `M350,${300 - 60 * corte} L350,${yc - 60 * corte} M350,${yc + 6} L350,${410}`);
  anzuelo.setAttribute('d', 'M350,410 L350,445 Q350,465 332,462 Q318,458 320,444'); dib(anzuelo, out(P(t, T.engan + .1, .3)));
  pon(dopa, 350, 300 - 60 * corte, back(P(t, T.dopa - .15, .4)), Math.min(1, P(t, T.dopa - .15, .15) * 3));
  pon(tijeras, 420, yc, back(P(t, T.corta - .2, .35)), Math.min(1, P(t, T.corta - .2, .15) * 3), -20 + 25 * Math.sin(Math.min(1, P(t, T.corta, .4)) * Math.PI));
  // subtítulo: la palabra que dice ahora, grande
  const w = [...PAL].reverse().find(x => x[1] <= t + .02); sub.textContent = w ? w[0] : ''; pon(sub, 540, 960, 1 + .06 * (1 - P(t, w ? w[1] : 0, .12)));
};
document.fonts.load('800 20px M').then(() => { window.pintar(8.9); document.title = 'listo'; });
</script></body></html>
