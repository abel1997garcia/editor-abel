<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Allan García · Presentación</title>
<style>
  @font-face { font-family: 'Corm'; src: url('fonts/corm.ttf'); font-weight: 300 700; }
  @font-face { font-family: 'CormI'; src: url('fonts/cormi.ttf'); font-weight: 300 700; font-style: italic; }
  @font-face { font-family: 'Mont'; src: url('fonts/mont.ttf'); font-weight: 100 900; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #cdb98f; font: 300 22px 'Mont', sans-serif; letter-spacing: .3em; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="start">CLIC PARA EMPEZAR</div>
<audio id="voz" src="voz_allan.mp3" preload="auto"></audio>
<audio id="music" src="musica.mp3" preload="auto"></audio>
<script>
// =====================================================================
//  utilidades
// =====================================================================
const W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const ramp = (t, a, b) => clamp((t - a) / (b - a));
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const words = s => s.replace(/\(.*?\)/g, '').split(/\s+/).filter(Boolean);

const IVORY = '#FFF8EC', GOLD = '#F4D79C', GOLD_D = '#C9A465', MUTED = '#C9C1B4', SOFT = '#ECE3D3';
const MOODS = {
  frio:   { c: [40, 60, 120],  i: .55 },
  sombra: { c: [70, 40, 90],   i: .45 },
  oscuro: { c: [90, 30, 50],   i: .36 },
  calido: { c: [200, 160, 90], i: .85 },
  luz:    { c: [200, 165, 105], i: 1 },
};

// =====================================================================
//  GUION · Allan habla en primera persona, de tú a tú.
//  voz   = lo que dice Allan (marca el tiempo de la escena)
//  lines = lo que se lee en pantalla. `k` = palabra de la voz en la que aparece
//  layout = tipo de motion graphic
//  hito  = punto activo de la línea de vida (acto 2)
// =====================================================================
const L = (text, f = 'serif', s = 84, c = IVORY, extra = {}) => ({ text, f, s, c, ...extra });
const SCENES = [
  // ---------- ACTO 1 · Lo que pasa por tu cabeza ahora mismo ----------
  { id: 'primera-vez', act: 1, mood: 'frio', layout: 'centro',
    voz: 'Puede que esta sea la primera vez que vienes a algo así. Y que hayas llegado hasta aquí sin saber muy bien qué te vas a encontrar.',
    lines: [L('Puede que esta sea la primera vez', 'serif', 92), L('que vienes a algo así.', 'italic', 108, GOLD, { k: 'que vienes' })] },
  { id: 'diferente', act: 1, mood: 'frio', layout: 'centro',
    voz: 'Quizá has visto vídeos, has leído cosas… pero estar aquí, en persona, es diferente.',
    lines: [L('Has visto vídeos, has leído cosas…', 'serif', 88), L('pero estar aquí es diferente.', 'italic', 108, GOLD, { k: 'pero estar' })] },
  { id: 'balanza', act: 1, mood: 'frio', layout: 'balanza',
    voz: 'Una parte de ti necesita saber. Y otra parte no quiere ilusionarse demasiado… por si acaso.',
    lines: [L('Una parte de ti necesita saber…', 'serif', 84), L('y otra no quiere ilusionarse demasiado.', 'italic', 84, GOLD, { k: 'Y otra parte' })] },
  { id: 'pensamientos', act: 1, mood: 'sombra', layout: 'dudas',
    voz: 'Y por dentro, a lo mejor estás pensando: ¿qué hago yo aquí? ¿Y si no viene nadie por mí? ¿Y si viene… y no estoy preparado? ¿Y si me emociono delante de todos? ¿Y si todo esto es mentira?',
    lines: [L('¿Qué hago yo aquí?', 'italic', 86, IVORY, { k: '¿qué hago', x: 540, y: 190 }),
            L('¿Y si no viene nadie por mí?', 'italic', 86, IVORY, { k: '¿Y si no viene', x: 1280, y: 360 }),
            L('¿Y si viene… y no estoy preparado?', 'italic', 86, IVORY, { k: '¿Y si viene…', x: 640, y: 540 }),
            L('¿Y si me emociono delante de todos?', 'italic', 86, IVORY, { k: '¿Y si me', x: 1220, y: 720 }),
            L('¿Y si todo esto es mentira?', 'italic', 96, GOLD, { k: '¿Y si todo', x: 800, y: 900 })] },
  { id: 'normal', act: 1, mood: 'sombra', layout: 'centro',
    voz: 'Es normal. Todo eso que estás sintiendo es normal. Es la primera vez que abres esta puerta. Y yo también tuve esas dudas. Muchas.',
    lines: [L('Es normal.', 'serif', 124), L('Es la primera vez que abres esta puerta.', 'serif', 72, SOFT, { k: 'Es la primera' }),
            L('Yo también tuve esas dudas.', 'italic', 100, GOLD, { k: 'Y yo también', gap: 20 })] },

  // ---------- ACTO 2 · Cómo llegué hasta aquí (línea de vida) ----------
  { id: 'nino', act: 2, hito: 0, mood: 'frio', layout: 'split',
    voz: 'Desde niño, algunos lugares me hacían sentir cosas que no sabía explicar. Era pequeño… y no tenía palabras para eso.',
    media: { tipo: 'foto', etiqueta: 'Allan de niño', opcional: true },
    lines: [L('Desde niño,', 'serif', 84), L('algunos lugares', 'serif', 84), L('me hacían sentir cosas', 'serif', 84, IVORY, { k: 'me hacían' }), L('que no sabía explicar.', 'italic', 92, GOLD, { k: 'que no sabía' })] },
  { id: 'iglesia', act: 2, hito: 0, mood: 'oscuro', layout: 'vitral',
    voz: 'Recuerdo una iglesia. Sentí algo tan real… que me asusté muchísimo. Así que hice lo que hacemos casi todos: lo guardé.',
    lines: [L('En una iglesia sentí algo tan real…', 'serif', 84), L('que me asusté muchísimo.', 'italic', 100, GOLD, { k: 'que me' }),
            L('Así que lo guardé.', 'serif', 72, SOFT, { k: 'lo guardé', gap: 30 })] },
  { id: 'estable', act: 2, hito: 1, mood: 'frio', layout: 'split',
    voz: 'Tuve un trabajo estable. Un buen sueldo. Desde fuera, todo estaba bien.',
    media: { tipo: 'foto', etiqueta: 'Allan en su etapa del trabajo estable' },
    lines: [L('Un trabajo estable.', 'serif', 88, IVORY, { k: 'Tuve' }), L('Un buen sueldo.', 'serif', 88, IVORY, { k: 'Un buen' }), L('Desde fuera,', 'italic', 92, GOLD, { k: 'Desde fuera' }), L('todo estaba bien.', 'italic', 92, GOLD, { k: 'todo estaba' })] },
  { id: 'infierno', act: 2, hito: 2, mood: 'oscuro', layout: 'centro',
    voz: 'Pero por dentro, no. Y no te voy a mentir: he estado en el infierno durante muchos años. Por eso, si hoy lo estás pasando mal… si sientes que te falta alguien… te entiendo. De verdad.',

            L('Por eso te entiendo.', 'serif', 84, GOLD, { k: 'Por eso', gap: 36 })] },
  { id: 'sueno', act: 2, hito: 3, mood: 'sombra', layout: 'polaroid',
    voz: 'Hasta que una noche… soñé con mi abuela.',
    media: { tipo: 'foto', etiqueta: 'Su abuela' },
    lines: [L('Hasta que una noche…', 'serif', 92), L('soñé con', 'italic', 116, GOLD, { k: 'soñé' }), L('mi abuela.', 'italic', 116, GOLD, { k: 'soñé' })] },
  { id: 'te-ayudare', act: 2, hito: 3, mood: 'calido', layout: 'centro', fx: 'destello',
    voz: 'Y me dijo: «Te voy a ayudar».',
    lines: [L('Y ME DIJO:', 'sans', 46, IVORY), L('«Te voy a ayudar.»', 'italic', 164, IVORY, { k: '«Te', gap: 18 })] },
  { id: 'el-don', act: 2, hito: 4, mood: 'luz', layout: 'centro',
    voz: 'A partir de ahí, poco a poco, dejé de huir de lo que sentía. Y entendí que el don siempre había estado ahí… desde aquel niño de la iglesia. Y que no era mío: era para dárselo a otros.',
    lines: [L('Dejé de huir de lo que sentía.', 'serif', 84, IVORY, { k: 'dejé de huir' }), L('El don siempre había estado ahí…', 'italic', 100, GOLD, { k: 'Y entendí' }),
            L('desde aquel niño de la iglesia.', 'italic', 84, SOFT, { k: 'desde aquel' })] },

  // ---------- ACTO 3 · Lo que vas a vivir hoy ----------
  { id: 'temer', act: 3, mood: 'luz', layout: 'escudo',
    voz: 'Por eso, antes de empezar, quiero que sepas algo: aquí no hay nada que temer. Las energías no molestan. No atacan. Nunca te harán daño. Jamás.',
    lines: [L('Aquí no hay', 'italic', 96, IVORY, { k: 'aquí no hay' }), L('nada que temer.', 'italic', 96, IVORY, { k: 'aquí no hay' }),
            L('No molestan.', 'serif', 74, GOLD, { k: 'no molestan', orbit: 0 }),
            L('No atacan.', 'serif', 74, GOLD, { k: 'No atacan', orbit: 1 }),
            L('Nunca te harán daño.', 'serif', 74, GOLD, { k: 'Nunca te', orbit: 2 })] },
  { id: 'velo', act: 3, mood: 'luz', layout: 'velo',
    voz: 'Lo que llega del otro lado es amor. Allí no existe el ego, ni el rencor. Todo se perdona. Y quienes se fueron… están en paz.',
    lines: [L('Amor.', 'italic', 150, GOLD, { k: 'es amor' }),
            L('Allí no existe el rencor.', 'serif', 76, IVORY, { k: 'Allí no' }),
            L('Todo se perdona.', 'italic', 92, GOLD, { k: 'Todo se' })] },
  { id: 'pasos', act: 3, mood: 'luz', layout: 'pasos',
    voz: 'En una sesión, yo siento lo que sentía esa persona. Veo imágenes. Te lo cuento. Y eres tú quien lo confirma. Míralo.',
    lines: [L('SIENTO', 'sans', 38, IVORY, { k: 'siento', icon: 'corazon', sp: 3 }),
            L('VEO', 'sans', 38, IVORY, { k: 'Veo', icon: 'ojo', sp: 3 }),
            L('TE LO CUENTO', 'sans', 38, IVORY, { k: 'Te lo', icon: 'voz', sp: 3 }),
            L('TÚ CONFIRMAS', 'sans', 38, GOLD, { k: 'Y eres', icon: 'check', sp: 3 })] },
  { id: 'prueba', act: 3, mood: 'luz', layout: 'video', dur: 18,
    voz: '(Audio original de los directos: Allan da un dato concreto y la persona lo confirma. 3 momentos de unos 6 s, en vertical.)',
    media: { tipo: 'video', etiqueta: 'Directos de Instagram (verticales)', clips: 3 }, lines: [] },
  { id: 'muro', act: 3, mood: 'luz', layout: 'muro',
    voz: 'Más de mil doscientas sesiones. Y cada una me sigue emocionando como la primera. Porque detrás de cada una hay una familia… y un amor que sigue ahí.',
    media: { tipo: 'video', etiqueta: 'Trocitos mudos de directos (verticales)', clips: 12 },
    lines: [L('SESIONES', 'sans', 48, IVORY, { k: 'sesiones' }), L('Y cada una me sigue emocionando', 'italic', 76, GOLD, { k: 'Y cada' }), L('como la primera.', 'italic', 76, GOLD, { k: 'como la' })] },
  { id: 'amor', act: 3, mood: 'calido', layout: 'centro',
    voz: 'El amor no muere. Solo cambia de lugar.',
    lines: [L('El amor no muere.', 'serif', 116), L('Solo cambia de lugar.', 'italic', 124, GOLD, { k: 'Solo' })] },
  { id: 'respira', act: 3, mood: 'calido', layout: 'respira', dur: 26,
    voz: 'Ahora, respira conmigo. Coge aire por la nariz… despacio… llenando el pecho… y suéltalo por la boca. Otra vez. Coge aire… siente cómo tu cuerpo se relaja… y suelta. Una vez más. Coge aire… con todo lo que traías hoy… y suéltalo todo.',
    lines: [L('Respira conmigo.', 'italic', 110, IVORY, { k: 'respira', at: 0.3 }),
            L('Coge aire…', 'italic', 120, IVORY, { k: 'Coge aire por', at: 2.6, breath: 'in' }),
            L('Suelta.', 'italic', 120, GOLD, { k: 'y suéltalo por', at: 7.4, breath: 'out' }),
            L('Coge aire…', 'italic', 120, IVORY, { k: 'Coge aire… siente', at: 11.2, breath: 'in' }),
            L('Suelta.', 'italic', 120, GOLD, { k: 'y suelta. Una', at: 15.2, breath: 'out' }),
            L('Coge aire…', 'italic', 120, IVORY, { k: 'Coge aire… con', at: 18.8, breath: 'in' }),
            L('Suéltalo todo.', 'italic', 120, GOLD, { k: 'y suéltalo todo', at: 22.6, breath: 'out' })] },
  { id: 'lugar', act: 3, mood: 'calido', layout: 'centro',
    voz: 'Estás en el lugar correcto.',
    lines: [L('Estás en el lugar correcto.', 'italic', 116, GOLD)] },
  { id: 'ponerle-voz', act: 3, mood: 'calido', layout: 'centro',
    voz: 'Quizá hoy alguien tiene algo que decirte. Algo que se quedó pendiente. Y yo estaré aquí para ponerle voz.',
    lines: [L('Quizá hoy alguien', 'serif', 92), L('tiene algo que decirte.', 'italic', 108, GOLD, { k: 'tiene' }),
            L('Y yo estaré aquí para ponerle voz.', 'serif', 76, SOFT, { k: 'Y yo', gap: 30 })] },
  { id: 'dejate', act: 3, mood: 'calido', layout: 'centro',
    voz: 'Así que siéntate, ponte cómodo… y déjate llevar.',
    lines: [L('Siéntate. Ponte cómodo.', 'serif', 104, IVORY, { k: 'siéntate' }), L('Y déjate llevar.', 'italic', 124, GOLD, { k: 'y déjate' })] },
  { id: 'logo', act: 3, mood: 'calido', layout: 'logo', dur: 6, voz: 'Empezamos.', lines: [] },
];

// =====================================================================
//  TIEMPOS
//  Ahora: estimación por palabras (≈2,5 palabras/s + respiración).
//  Con el audio real: TIEMPOS_REALES[id] = { t0, t1, palabras: [t de cada palabra] }
// =====================================================================
const TIEMPOS_REALES = {};
const PAL_SEG = 2.8, RESPIRO = 0.5, INICIO = 1.2;  // 2,8 pal/s ya incluye sus pausas naturales (medido en sus vídeos)
(function () {
  let t = INICIO;
  for (const sc of SCENES) {
    const n = words(sc.voz).length;
    const dur = sc.dur ?? Math.max(3.2, n / PAL_SEG + RESPIRO);
    const real = TIEMPOS_REALES[sc.id];
    sc.t0 = real ? real.t0 : t;
    sc.t1 = real ? real.t1 : t + dur;
    sc.speak = Math.max(0.5, sc.t1 - sc.t0 - RESPIRO);
    sc.n = n;
    // momento en que aparece cada línea = cuando Allan dice la palabra `k`
    sc.lines.forEach((l, i) => {
      let wi = 0;
      if (l.k) {
        const idx = sc.voz.toLowerCase().indexOf(l.k.toLowerCase());
        wi = idx >= 0 ? words(sc.voz.slice(0, idx)).length : 0;
      }
      l.wi = wi;
      l.tIn = real?.palabras ? real.palabras[wi] : (l.at != null ? sc.t0 + l.at : sc.t0 + (n ? wi / n : 0) * sc.speak + (l.k ? 0 : i * 0.15));
    });
    t = sc.t1;
  }
})();
const DUR = SCENES[SCENES.length - 1].t1 + 0.6;
const byId = Object.fromEntries(SCENES.map(s => [s.id, s]));
const OVER = 0.35;
const MEDIA = {}; window.MEDIA = MEDIA;   // id -> imagen / vídeo (o array de vídeos)

// =====================================================================
//  texto
// =====================================================================
function fontOf(l) {
  if (l.f === 'italic') return `italic 400 ${l.s}px CormI`;
  if (l.f === 'sans') return `500 ${l.s}px Mont`;
  return `400 ${l.s}px Corm`;
}
const spacingOf = l => l.sp ?? (l.f === 'sans' ? l.s * 0.3 : 0);
function measure(l) {
  ctx.font = fontOf(l); const sp = spacingOf(l);
  return l.text.split(' ').reduce((a, w) => a + ctx.measureText(w).width + sp * w.length, 0) + ctx.measureText(' ').width * (l.text.split(' ').length - 1);
}
// align: 'center' | 'left'
function drawLine(l, x, cy, tIn, tOut, t, align = 'center') {
  ctx.font = fontOf(l);
  const sp = spacingOf(l);
  const ws = l.text.split(' ');
  const spaceW = ctx.measureText(' ').width;
  const wW = ws.map(w => ctx.measureText(w).width + sp * w.length);
  const total = wW.reduce((a, b) => a + b, 0) + spaceW * (ws.length - 1);
  let xx0 = align === 'center' ? x - total / 2 : x;
  const out = ramp(t, tOut - 0.7, tOut + OVER);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ws.forEach((w, i) => {
    const k = easeOut(ramp(t, tIn + i * 0.08, tIn + i * 0.08 + 0.9));
    const a = k * (1 - out);
    if (a > 0.003) {
      ctx.save();
      ctx.globalAlpha *= a;
      const blur = (1 - k) * 14 + out * 10;
      if (blur > 0.3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
      ctx.fillStyle = l.c;
      ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 3;
      const y = cy + (1 - k) * 22 - out * 14;
      if (sp) { let xx = xx0; for (const ch of w) { ctx.fillText(ch, xx, y); xx += ctx.measureText(ch).width + sp; } }
      else ctx.fillText(w, xx0, y);
      ctx.restore();
    }
    xx0 += wW[i] + spaceW;
  });
}
function scrim(x, cy, w, h, a, align = 'center') {
  if (a <= 0) return;
  const cx = align === 'center' ? x : x + w / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, h / w);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, w * .62);
  g.addColorStop(0, `rgba(4,3,6,${.62 * a})`); g.addColorStop(.6, `rgba(4,3,6,${.38 * a})`); g.addColorStop(1, 'rgba(4,3,6,0)');
  ctx.fillStyle = g; ctx.fillRect(-w, -w, w * 2, w * 2); ctx.restore();
}
function drawBlock(sc, t, x, cy, align = 'center', lines = sc.lines) {
  const hs = lines.map(l => l.s * 1.2 + (l.gap || 0));
  const bw = Math.max(...lines.map(measure)) + 160, bh = hs.reduce((a, b) => a + b, 0) + 140;
  scrim(x, cy, bw, bh, sceneAlpha(sc, t), align);
  let y = cy - hs.reduce((a, b) => a + b, 0) / 2;
  lines.forEach(l => { y += l.gap || 0; drawLine(l, x, y + l.s * .6, l.tIn, sc.t1, t, align); y += l.s * 1.2; });
}
const sceneAlpha = (sc, t) => ramp(t, sc.t0 - .2, sc.t0 + .8) * (1 - ramp(t, sc.t1 - .4, sc.t1 + OVER + .4));

// =====================================================================
//  media: imagen real o hueco de maqueta
// =====================================================================
function placeholder(x, y, w, h, title, sub) {
  ctx.save();
  ctx.fillStyle = 'rgba(32,26,20,.72)'; ctx.fillRect(x, y, w, h);
  ctx.setLineDash([12, 9]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(226,197,139,.8)'; ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `500 ${Math.max(16, Math.min(30, w / 18))}px Mont`; ctx.fillStyle = GOLD;
  ctx.fillText(title, x + w / 2, y + h / 2 - (sub ? 22 : 0));
  if (sub) { ctx.font = `italic 400 ${Math.max(18, Math.min(38, w / 16))}px CormI`; ctx.fillStyle = IVORY; ctx.fillText(sub, x + w / 2, y + h / 2 + 24); }
  ctx.restore();
}
function drawCover(el, x, y, w, h, z = 1, dx = 0, filter = 'none') {
  const iw = el.naturalWidth || el.videoWidth, ih = el.naturalHeight || el.videoHeight;
  const s = Math.max(w / iw, h / ih) * z;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.filter = filter;
  ctx.drawImage(el, x + w / 2 - iw * s / 2 + dx, y + h / 2 - ih * s / 2, iw * s, ih * s);
  ctx.restore();
}
const ready = el => el && (el.naturalWidth || el.videoWidth);
function wrapText(txt, x, y, maxW, lh) {
  const ws = txt.split(' '); let line = '';
  for (const w of ws) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = w; } else line = test; }
  if (line) ctx.fillText(line, x, y);
}

// =====================================================================
//  LAYOUTS
// =====================================================================
const LAYOUT = {
  centro(sc, t) { drawBlock(sc, t, W / 2, H / 2); },

  // foto que entra de lado con máscara + texto alineado a la izquierda
  split(sc, t) {
    const a = sceneAlpha(sc, t), k = easeOut(ramp(t, sc.t0, sc.t0 + 1.4)), p = ramp(t, sc.t0, sc.t1 + 1);
    const cw = 640, ch = 800, cx = 1130 + (1 - k) * 90, cy = 140;
    ctx.save(); ctx.globalAlpha = a;
    // halo
    const g = ctx.createRadialGradient(cx + cw / 2, cy + ch / 2, 50, cx + cw / 2, cy + ch / 2, 620);
    g.addColorStop(0, 'rgba(226,197,139,.16)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // máscara que se abre de abajo a arriba
    ctx.beginPath(); ctx.rect(cx, cy + ch * (1 - k), cw, ch * k); ctx.clip();
    const el = MEDIA[sc.id];
    if (ready(el)) drawCover(el, cx, cy, cw, ch, lerp(1.12, 1.02, p), 0, 'sepia(.2) brightness(.85)');
    else placeholder(cx, cy, cw, ch, 'FOTO' + (sc.media.opcional ? ' · OPCIONAL' : ''), sc.media.etiqueta);
    ctx.restore();
    ctx.save(); ctx.globalAlpha = a * k; ctx.strokeStyle = 'rgba(226,197,139,.55)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(cx + 18, cy + 18, cw, ch); ctx.restore();
    drawBlock(sc, t, 170, H / 2, 'left');
  },

  // la foto de la abuela como polaroid, con luz cálida detrás
  polaroid(sc, t) {
    const a = sceneAlpha(sc, t), k = easeOut(ramp(t, sc.t0, sc.t0 + 1.8)), p = ramp(t, sc.t0, sc.t1 + 1);
    ctx.save(); ctx.globalAlpha = a;

  // velo: aquí | el otro lado, un hilo de luz que cruza hacia nosotros

  // 3 momentos reales de los directos (VERTICALES 9:16).

  video(sc, t) {

      ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 14;
      ctx.fillText(`SESIÓN REAL · ${i + 1}/${n}`, tx, 250); ctx.letterSpacing = '0px';
      ctx.fillStyle = 'rgba(244,215,156,.6)'; ctx.fillRect(tx, 300, 160, 2);
      const rows = sub || [['ALLAN:', 'el dato concreto que da'], ['LA PERSONA:', '«¡Sí! Es verdad.»']];
      rows.forEach(([who, txt], j) => {
        const y = 420 + j * 230;
        ctx.font = '500 34px Mont'; ctx.fillStyle = MUTED; ctx.letterSpacing = '4px'; ctx.fillText(who, tx, y); ctx.letterSpacing = '0px';

    }
  },

  // muro de directos VERTICALES que deriva + contador
  muro(sc, t) {
    const a = sceneAlpha(sc, t), p = ramp(t, sc.t0 - 1, sc.t1 + 1);
    const cw = 300, ch = Math.round(cw * 16 / 9), gap = 26, cols = 8, rows = 2;

      const i = r * cols + c;
      const kk = easeOut(ramp(t, sc.t0 + (i % 7) * .12, sc.t0 + (i % 7) * .12 + 1));
      const dir = r % 2 ? 1 : -1;

      ctx.globalAlpha = a * kk * .85;
      const el = vids[i % Math.max(1, vids.length)];

      else { ctx.fillStyle = 'rgba(40,33,26,.95)'; ctx.fillRect(x, y, cw, ch); ctx.strokeStyle = 'rgba(244,215,156,.35)'; ctx.setLineDash([8, 7]); ctx.strokeRect(x, y, cw, ch); ctx.setLineDash([]);
        ctx.font = '500 20px Mont'; ctx.fillStyle = 'rgba(244,215,156,.7)'; ctx.textAlign = 'center'; ctx.fillText('DIRECTO 9:16', x + cw / 2, y + ch / 2); }
    }
    ctx.restore();
    const g = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 950);
    g.addColorStop(0, `rgba(4,3,6,${.88 * a})`); g.addColorStop(.55, `rgba(4,3,6,${.55 * a})`); g.addColorStop(1, `rgba(4,3,6,${.2 * a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const n = Math.round(1200 * k);
    const txt = '+' + (n >= 1000 ? Math.floor(n / 1000) + '.' + String(n % 1000).padStart(3, '0') : n);
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '400 250px Corm'; ctx.fillStyle = GOLD; ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 30;
    ctx.fillText(txt, W / 2, H / 2 - 150); ctx.restore();
    drawLine(sc.lines[0], W / 2, H / 2 + 20, sc.lines[0].tIn, sc.t1, t);
    drawLine(sc.lines[1], W / 2, H / 2 + 140, sc.lines[1].tIn, sc.t1, t);
    drawLine(sc.lines[2], W / 2, H / 2 + 235, sc.lines[2].tIn, sc.t1, t);
  },

  // respiración guiada: el círculo crece al coger aire y se encoge al soltar
  respira(sc, t) {
    const a = sceneAlpha(sc, t);
    const br = sc.lines.filter(l => l.breath);
    let r = 0;  // 0 = vacío, 1 = pulmones llenos
    br.forEach((l, i) => {
      if (t < l.tIn) return;
      const nx = br[i + 1] ? br[i + 1].tIn : sc.t1;
      const k = ease(ramp(t, l.tIn, Math.min(nx, l.tIn + 4)));

    ctx.beginPath(); ctx.arc(W / 2, H / 2, R, 0, 7); ctx.stroke();
    ctx.globalAlpha = a * .3; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(W / 2, H / 2, R * 1.16, 0, 7); ctx.stroke();
    ctx.restore();

    const shown = sc.lines.filter(l => t >= l.tIn - .1);
    const cur = shown[shown.length - 1] || sc.lines[0];
    sc.lines.forEach((l, i) => {
      const nx = sc.lines[i + 1];
      const tOut = nx ? nx.tIn : sc.t1;
      if (t < l.tIn - .2 || t > tOut + OVER + .2) return;
      scrim(W / 2, H / 2, measure(l) + 140, l.s * 2.4, a * ramp(t, l.tIn, l.tIn + .5));
      drawLine(l, W / 2, H / 2, l.tIn, tOut, t);

  },

  logo(sc, t) { finale(sc, t); },
};

function drawIcon(name, t) {
  ctx.save(); ctx.scale(1.25, 1.25); ctx.strokeStyle = IVORY; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  if (name === 'corazon') {
    ctx.moveTo(0, 26); ctx.bezierCurveTo(-46, -6, -30, -42, 0, -18); ctx.bezierCurveTo(30, -42, 46, -6, 0, 26);
  } else if (name === 'ojo') {
    ctx.moveTo(-40, 0); ctx.quadraticCurveTo(0, -38, 40, 0); ctx.quadraticCurveTo(0, 38, -40, 0);
    ctx.moveTo(13, 0); ctx.arc(0, 0, 13, 0, 7);
  } else if (name === 'voz') {
    for (let i = 0; i < 3; i++) { const r = 14 + i * 13; ctx.moveTo(-18 + r * Math.cos(-.7), r * Math.sin(-.7)); ctx.arc(-18, 0, r, -.7, .7); }
    ctx.moveTo(-30, -8); ctx.lineTo(-30, 8);
  } else if (name === 'check') {
    ctx.moveTo(-24, 2); ctx.lineTo(-6, 20); ctx.lineTo(28, -18);
  }
  ctx.stroke(); ctx.restore();
}

// línea de vida del acto 2
const HITOS = ['Infancia', 'Una vida estable', 'Años difíciles', 'El sueño', 'El don'];
function timeline(t) {
  const act2 = SCENES.filter(s => s.act === 2);
  const t0 = act2[0].t0, t1 = act2[act2.length - 1].t1;
  const a = ramp(t, t0 - .3, t0 + 1) * (1 - ramp(t, t1 - .2, t1 + 1));
  if (a <= 0) return;
  let cur = act2[0]; for (const s of act2) if (t >= s.t0 - .2) cur = s;
  const x0 = 300, x1 = 1620, y = 1010;
  const xs = HITOS.map((_, i) => lerp(x0, x1, i / (HITOS.length - 1)));
  const prev = act2.filter(s => s.t0 < cur.t0).pop();
  const from = prev ? xs[prev.hito] : xs[0];
  const px = lerp(from, xs[cur.hito], easeOut(ramp(t, cur.t0 - .2, cur.t0 + 1.2)));
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = 'rgba(226,197,139,.22)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.strokeStyle = 'rgba(226,197,139,.85)'; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(px, y); ctx.stroke();
  ctx.textAlign = 'center'; ctx.font = '500 27px Mont'; ctx.letterSpacing = '3px';
  HITOS.forEach((h, i) => {
    const on = xs[i] <= px + 1, act = i === cur.hito;
    ctx.beginPath(); ctx.arc(xs[i], y, act ? 7 : 4.5, 0, 7);
    ctx.fillStyle = on ? GOLD : 'rgba(226,197,139,.3)'; ctx.fill();
    if (act) { ctx.globalAlpha = a * (.4 + .3 * Math.sin(t * 3)); ctx.beginPath(); ctx.arc(xs[i], y, 16, 0, 7); ctx.strokeStyle = GOLD; ctx.stroke(); ctx.globalAlpha = a; }
    ctx.fillStyle = act ? IVORY : on ? GOLD : 'rgba(201,193,180,.55)';
    ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 10; ctx.fillText(h.toUpperCase(), xs[i], y - 32); ctx.shadowBlur = 0;
  });
  ctx.letterSpacing = '0px';
  ctx.restore();
}

const R = rng(7);
const PARTS = Array.from({ length: 240 }, () => ({ x: R() * W, y: R() * H, z: 0.3 + R() * 1.4, ph: R() * 6.28, sp: 6 + R() * 22, tw: 0.5 + R() * 2 }));
const NEB = [{ x: .30, y: .35, r: .55, ph: 0 }, { x: .72, y: .62, r: .6, ph: 2 }, { x: .5, y: .5, r: .45, ph: 4 }];
const grain = document.createElement('canvas'); grain.width = grain.height = 512;
{ const g = grain.getContext('2d'), im = g.createImageData(512, 512), r = rng(3);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); }
function mood(t) {
  let i = 0; while (i < SCENES.length - 1 && t > SCENES[i + 1].t0) i++;
  const a = MOODS[SCENES[i].mood], nx = SCENES[i + 1];

  const b = MOODS[nx.mood], k = ease(ramp(t, nx.t0 - 1.5, nx.t0 + .5));
  return { c: a.c.map((v, j) => Math.round(lerp(v, b.c[j], k))), i: lerp(a.i, b.i, k) };
}
const T_DESTELLO = () => byId['te-ayudare'].t0 + 0.6;
const T_LUZ = () => byId['el-don'].t0 - 0.5;
function background(t) {
  const m = mood(t);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05070f'); g.addColorStop(1, '#020205');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  NEB.forEach((n, i) => {
    const x = (n.x + Math.sin(t * .05 + n.ph) * .06) * W, y = (n.y + Math.cos(t * .04 + n.ph) * .05) * H;
    const r = n.r * W * (1 + .05 * Math.sin(t * .2 + i));
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r), [cr, cg, cb] = m.c;
    rg.addColorStop(0, `rgba(${cr},${cg},${cb},${.22 * m.i})`);
    rg.addColorStop(.5, `rgba(${cr * .6 | 0},${cg * .6 | 0},${cb * .7 | 0},${.08 * m.i})`);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  });
  const tl = T_LUZ(), td = T_DESTELLO();
  // los rayos acompañan el despertar y se retiran durante los vídeos
  const vid = Math.max(...['prueba', 'muro'].map(id => sceneAlpha(byId[id], t)));
  const rays = ramp(t, tl, tl + 5) * (1 - ramp(t, DUR - 6, DUR)) * (1 - vid * .85);
  if (rays > 0) {
    ctx.save(); ctx.translate(W / 2, -200);
    for (let i = 0; i < 9; i++) {
      ctx.save(); ctx.rotate(-0.55 + i * 0.137 + Math.sin(t * .15 + i) * .03);
      const lg = ctx.createLinearGradient(0, 0, 0, 1500);
      lg.addColorStop(0, `rgba(255,225,170,${.05 * rays})`); lg.addColorStop(1, 'rgba(255,225,170,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.lineTo(90 + i * 6, 1500); ctx.lineTo(-90 - i * 6, 1500); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  const ts = byId['sueno'].t0;
  const orb = (.25 + .35 * ramp(t, ts, td) + .4 * ramp(t, td - .5, td + 1)) * (1 - .5 * ramp(t, DUR - 5, DUR));
  const or = 380 + 260 * ramp(t, ts, td + 2);
  const og = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, or);
  og.addColorStop(0, `rgba(255,232,190,${.12 * orb})`); og.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = og; ctx.fillRect(0, 0, W, H);
  const energy = .55 + .25 * ramp(t, ts, td) + .45 * ramp(t, td, td + 4);
  PARTS.forEach(p => {
    const y = ((p.y - t * p.sp * p.z * energy) % H + H) % H, x = p.x + Math.sin(t * .3 + p.ph) * 30 * p.z;
    const a = clamp((.45 + .55 * Math.sin(t * p.tw + p.ph)) * .7 * p.z * energy * m.i, 0, 1);
    const r = 1.1 * p.z + (p.z > 1.3 ? 1.2 : 0);
    const pg = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
    pg.addColorStop(0, `rgba(255,236,200,${a})`); pg.addColorStop(1, 'rgba(255,236,200,0)');
    ctx.fillStyle = pg; ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
  });
  ctx.globalCompositeOperation = 'source-over';
}
function overlays(t) {
  const flash = Math.exp(-Math.pow((t - T_DESTELLO()) / 0.45, 2)) * .5;
  if (flash > .01) { ctx.fillStyle = `rgba(255,240,215,${flash})`; ctx.fillRect(0, 0, W, H); }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .38, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay';
  ctx.translate(-((t * 977) % 512), -((t * 613) % 512));
  ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.fillRect(0, 0, W + 512, H + 512);
  ctx.restore();
  const fade = 1 - ramp(t, 0, 1.2) * (1 - ramp(t, DUR - 1.4, DUR));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
function finale(sc, t) {
  const t0 = sc.t0, a = 1 - ramp(t, DUR - 1.6, DUR - .2);
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const k = easeOut(ramp(t, t0, t0 + 2.6)), name = 'ALLAN GARCÍA';
  ctx.font = '400 128px Corm';
  const sp = lerp(70, 26, k), ws = [...name].map(c => ctx.measureText(c).width);
  const tw = ws.reduce((x, y) => x + y, 0) + sp * (name.length - 1);
  let x = W / 2 - tw / 2;
  const gg = ctx.createLinearGradient(W / 2 - tw / 2, 0, W / 2 + tw / 2, 0);
  gg.addColorStop(0, GOLD_D); gg.addColorStop(.5, '#FFF1D2'); gg.addColorStop(1, GOLD_D);
  ctx.filter = `blur(${((1 - k) * 12).toFixed(1)}px)`;
  ctx.fillStyle = gg; ctx.shadowColor = 'rgba(226,197,139,.6)'; ctx.shadowBlur = 36; ctx.globalAlpha = a * k;
  [...name].forEach((c, i) => { ctx.fillText(c, x + ws[i] / 2, H / 2 - 40); x += ws[i] + sp; });
  ctx.filter = 'none'; ctx.shadowBlur = 0;
  const lw = 260 * easeOut(ramp(t, t0 + 1.2, t0 + 2.8));
  ctx.fillStyle = GOLD_D; ctx.globalAlpha = a;
  ctx.fillRect(W / 2 - 40 - lw - 150, H / 2 + 62, lw, 1.5); ctx.fillRect(W / 2 + 190, H / 2 + 62, lw, 1.5);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = a;
  drawLine(L('MÉDIUM', 'sans', 42, IVORY), W / 2, H / 2 + 62, t0 + 1.4, 999, t);
  drawLine(L('Empezamos.', 'italic', 96, GOLD), W / 2, H / 2 + 210, t0 + 0.4, 999, t);
  ctx.restore();
}

function renderFrame(t) {
  ctx.save();
  background(t);
  const z = 1 + .01 * Math.sin(t * .25);
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  for (const sc of SCENES) if (t > sc.t0 - .6 && t < sc.t1 + OVER + .6) LAYOUT[sc.layout](sc, t);
  ctx.restore();
  timeline(t);
  overlays(t);
}
window.renderFrame = renderFrame; window.DUR = DUR; window.SCENES = SCENES;

// =====================================================================
//  reproducción en directo
// =====================================================================
const voz = document.getElementById('voz'), music = document.getElementById('music');
let tStart = null;
function loop() { const t = (performance.now() - tStart) / 1000; renderFrame(Math.min(t, DUR)); if (t < DUR) requestAnimationFrame(loop); }
document.getElementById('start').onclick = async () => {
  document.getElementById('start').remove();
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  tStart = performance.now(); music.volume = 0.3;
  voz.play().catch(() => {}); music.play().catch(() => {});
  loop();
};
window.fontsReady = Promise.all(['400 40px Corm', '300 40px Corm', 'italic 400 40px CormI', '400 40px Mont', '500 40px Mont'].map(f => document.fonts.load(f))).then(() => document.fonts.ready);
window.fontsReady.then(() => renderFrame(0));
</script>
</body>
