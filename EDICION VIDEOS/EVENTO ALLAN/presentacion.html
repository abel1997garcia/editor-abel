<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Allan García · Presentación</title>
<style>
  @font-face { font-family: 'Corm'; src: url('fonts/corm.ttf'); font-weight: 300 700; }
  @font-face { font-family: 'CormI'; src: url('fonts/cormi.ttf'); font-weight: 300 700; font-style: italic; }
  @font-face { font-family: 'Mont'; src: url('fonts/mont.ttf'); font-weight: 100 900; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #cdb98f; font: 300 22px 'Mont', sans-serif; letter-spacing: .3em; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="start">CLIC PARA EMPEZAR</div>
<audio id="voz" src="voz_allan.mp3" preload="auto"></audio>
<audio id="music" src="musica.mp3" preload="auto"></audio>
<script>
// =====================================================================
//  utilidades
// =====================================================================
const W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const ramp = (t, a, b) => clamp((t - a) / (b - a));
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const words = s => s.replace(/\(.*?\)/g, '').split(/\s+/).filter(Boolean);

const IVORY = '#F5EEDF', GOLD = '#E2C58B', GOLD_D = '#B8955A', MUTED = '#A9A39A', SOFT = '#CFC6B6';
const MOODS = {
  frio:   { c: [40, 60, 120],  i: .55 },
  sombra: { c: [70, 40, 90],   i: .45 },
  oscuro: { c: [90, 30, 50],   i: .36 },
  calido: { c: [200, 160, 90], i: .85 },
  luz:    { c: [200, 165, 105], i: 1 },
};

// =====================================================================
//  GUION · Allan habla en primera persona, de tú a tú.
//  voz   = lo que dice Allan (marca el tiempo de la escena)
//  lines = lo que se lee en pantalla. `k` = palabra de la voz en la que aparece
//  layout = tipo de motion graphic
//  hito  = punto activo de la línea de vida (acto 2)
// =====================================================================
const L = (text, f = 'serif', s = 84, c = IVORY, extra = {}) => ({ text, f, s, c, ...extra });
const SCENES = [
  // ---------- ACTO 1 · Lo que sientes ahora mismo ----------
  { id: 'corazon', act: 1, mood: 'frio', layout: 'centro',
    voz: 'Puede que ahora mismo tengas el corazón un poco acelerado.',
    lines: [L('Puede que ahora mismo', 'serif', 84), L('tengas el corazón un poco acelerado.', 'italic', 96, GOLD, { k: 'tengas' })] },
  { id: 'balanza', act: 1, mood: 'frio', layout: 'balanza',
    voz: 'Quizá una parte de ti tiene ganas… y otra parte tiene miedo.',
    lines: [L('Una parte de ti tiene ganas…', 'serif', 72), L('y otra parte tiene miedo.', 'italic', 80, GOLD, { k: 'y otra' })] },
  { id: 'dudas', act: 1, mood: 'sombra', layout: 'dudas',
    voz: 'Y quizá te preguntas: ¿y si no funciona? ¿Y si no viene nadie? ¿Y si todo esto es mentira?',
    lines: [L('¿Y si no funciona?', 'italic', 96, IVORY, { k: '¿y si no funciona', x: 560, y: 330 }),
            L('¿Y si no viene nadie?', 'italic', 96, IVORY, { k: '¿Y si no viene', x: 1330, y: 520 }),
            L('¿Y si todo esto es mentira?', 'italic', 96, GOLD, { k: '¿Y si todo', x: 820, y: 760 })] },
  { id: 'normal', act: 1, mood: 'sombra', layout: 'centro',
    voz: 'Es normal. Yo también he tenido miedo.',
    lines: [L('Es normal.', 'serif', 120), L('Yo también he tenido miedo.', 'italic', 96, GOLD, { k: 'Yo también' })] },

  // ---------- ACTO 2 · Cómo llegué hasta aquí (línea de vida) ----------
  { id: 'nino', act: 2, hito: 0, mood: 'frio', layout: 'split',
    voz: 'Desde niño, algunos lugares me hacían sentir cosas que no sabía explicar.',
    media: { tipo: 'foto', etiqueta: 'Allan de niño', opcional: true },
    lines: [L('Desde niño, algunos lugares', 'serif', 72), L('me hacían sentir cosas', 'serif', 72), L('que no sabía explicar.', 'italic', 84, GOLD, { k: 'que no sabía' })] },
  { id: 'iglesia', act: 2, hito: 0, mood: 'oscuro', layout: 'vitral',
    voz: 'En una iglesia sentí algo tan real… que pasé muchísimo miedo. Así que lo guardé.',
    lines: [L('En una iglesia sentí algo tan real…', 'serif', 72), L('que pasé muchísimo miedo.', 'italic', 88, GOLD, { k: 'que pasé' }),
            L('Así que lo guardé.', 'serif', 58, SOFT, { k: 'Así que', gap: 34 })] },
  { id: 'estable', act: 2, hito: 1, mood: 'frio', layout: 'split',
    voz: 'Tuve un trabajo estable. Un buen sueldo. Desde fuera, todo estaba bien.',
    media: { tipo: 'foto', etiqueta: 'Allan en su etapa del trabajo estable' },
    lines: [L('Un trabajo estable.', 'serif', 76), L('Un buen sueldo.', 'serif', 76, IVORY, { k: 'Un buen' }), L('Desde fuera, todo estaba bien.', 'italic', 80, GOLD, { k: 'Desde fuera' })] },
  { id: 'cuerpo', act: 2, hito: 1, mood: 'sombra', layout: 'centro',
    voz: 'Pero por dentro, no. Mi cuerpo me decía que ese no era mi camino.',
    lines: [L('Pero por dentro, no.', 'serif', 96), L('Mi cuerpo me decía', 'serif', 70, SOFT, { k: 'Mi cuerpo', gap: 24 }), L('que ese no era mi camino.', 'italic', 92, GOLD, { k: 'que ese' })] },
  { id: 'infierno', act: 2, hito: 2, mood: 'oscuro', layout: 'centro',
    voz: 'He estado en el infierno durante muchos años. Por eso, si hoy lo estás pasando mal… te entiendo.',
    lines: [L('«He estado en el infierno', 'italic', 96), L('durante muchos años.»', 'italic', 96),
            L('Por eso te entiendo.', 'serif', 66, GOLD, { k: 'Por eso', gap: 40 })] },
  { id: 'sueno', act: 2, hito: 3, mood: 'sombra', layout: 'polaroid',
    voz: 'Hasta que una noche… soñé con mi abuela.',
    media: { tipo: 'foto', etiqueta: 'Su abuela' },
    lines: [L('Hasta que una noche…', 'serif', 80), L('soñé con mi abuela.', 'italic', 100, GOLD, { k: 'soñé' })] },
  { id: 'te-ayudare', act: 2, hito: 3, mood: 'calido', layout: 'centro', fx: 'destello',
    voz: 'Y me dijo: «Te voy a ayudar».',
    lines: [L('Y ME DIJO:', 'sans', 40, IVORY), L('«Te voy a ayudar.»', 'italic', 156, IVORY, { k: '«Te', gap: 18 })] },
  { id: 'el-don', act: 2, hito: 4, mood: 'luz', layout: 'centro',
    voz: 'Poco a poco dejé de huir de lo que sentía. Y entendí que el don siempre había estado ahí… desde aquel niño que tenía miedo.',
    lines: [L('Dejé de huir de lo que sentía.', 'serif', 76), L('El don siempre había estado ahí…', 'italic', 92, GOLD, { k: 'Y entendí' }),
            L('desde aquel niño que tenía miedo.', 'italic', 70, SOFT, { k: 'desde aquel' })] },

  // ---------- ACTO 3 · Lo que vas a vivir hoy (tranquilizar) ----------
  { id: 'temer', act: 3, mood: 'luz', layout: 'escudo',
    voz: 'Y quiero que sepas algo: aquí no hay nada que temer. Las energías no molestan. No atacan. Nunca te harán daño.',
    lines: [L('No hay nada que temer.', 'italic', 84, IVORY, { k: 'aquí no hay' }),
            L('No molestan', 'sans', 30, GOLD, { k: 'no molestan', orbit: 0 }),
            L('No atacan', 'sans', 30, GOLD, { k: 'No atacan', orbit: 1 }),
            L('Nunca hacen daño', 'sans', 30, GOLD, { k: 'Nunca te', orbit: 2 })] },
  { id: 'velo', act: 3, mood: 'luz', layout: 'velo',
    voz: 'Lo que llega del otro lado es amor. Allí no existe el miedo, ni el rencor. Todo se perdona.',
    lines: [L('Amor', 'italic', 130, GOLD, { k: 'es amor' }),
            L('Sin miedo. Sin rencor.', 'serif', 64, IVORY, { k: 'Allí no' }),
            L('Todo se perdona.', 'italic', 76, GOLD, { k: 'Todo se' })] },
  { id: 'pasos', act: 3, mood: 'luz', layout: 'pasos',
    voz: 'Yo siento lo que sentía esa persona. Veo imágenes. Te lo cuento. Y eres tú quien lo confirma.',
    lines: [L('SIENTO', 'sans', 30, IVORY, { k: 'siento', icon: 'corazon' }),
            L('VEO', 'sans', 30, IVORY, { k: 'Veo', icon: 'ojo' }),
            L('TE LO CUENTO', 'sans', 30, IVORY, { k: 'Te lo', icon: 'voz' }),
            L('TÚ CONFIRMAS', 'sans', 30, GOLD, { k: 'Y eres', icon: 'check' })] },
  { id: 'compruebes', act: 3, mood: 'luz', layout: 'centro',
    voz: 'No te pido que me creas. Te pido que escuches… y que lo compruebes tú.',
    lines: [L('No te pido que me creas.', 'serif', 90), L('Te pido que escuches…', 'italic', 96, GOLD, { k: 'Te pido' }),
            L('y que lo compruebes tú.', 'italic', 96, GOLD, { k: 'y que lo' })] },
  { id: 'prueba', act: 3, mood: 'luz', layout: 'video', dur: 21,
    voz: '(Audio original: Allan da un dato concreto y la persona lo confirma. 3 momentos de unos 7 s.)',
    media: { tipo: 'video', etiqueta: 'Recopilatorio de sesiones', clips: 3 }, lines: [] },
  { id: 'muro', act: 3, mood: 'luz', layout: 'muro',
    voz: 'Más de mil doscientas sesiones. Y cada una me sigue emocionando como la primera.',
    media: { tipo: 'video', etiqueta: 'Clips cortos de sesiones (sin sonido)', clips: 9 },
    lines: [L('SESIONES', 'sans', 40, IVORY, { k: 'sesiones' }), L('Y cada una me sigue emocionando como la primera.', 'italic', 62, GOLD, { k: 'Y cada' })] },
  { id: 'necesitan', act: 3, mood: 'calido', layout: 'centro',
    voz: 'Tus seres queridos también necesitan decirte cosas.',
    lines: [L('Tus seres queridos también', 'serif', 80), L('necesitan decirte cosas.', 'italic', 100, GOLD, { k: 'necesitan decirte' })] },
  { id: 'amor', act: 3, mood: 'calido', layout: 'centro',
    voz: 'El amor no muere. Solo cambia de lugar.',
    lines: [L('El amor no muere.', 'serif', 110), L('Solo cambia de lugar.', 'italic', 116, GOLD, { k: 'Solo' })] },
  { id: 'respira', act: 3, mood: 'calido', layout: 'respira',
    voz: 'Así que respira. Estás en el lugar correcto.',
    lines: [L('Respira.', 'italic', 130, IVORY, { k: 'respira' }), L('Estás en el lugar correcto.', 'serif', 64, GOLD, { k: 'Estás' })] },
  { id: 'ponerle-voz', act: 3, mood: 'calido', layout: 'centro',
    voz: 'Quizá hoy alguien tiene algo que decirte. Y yo estaré aquí para ponerle voz.',
    lines: [L('Quizá hoy alguien', 'serif', 84), L('tiene algo que decirte.', 'italic', 100, GOLD, { k: 'tiene' }),
            L('Y yo estaré aquí para ponerle voz.', 'serif', 60, SOFT, { k: 'Y yo', gap: 36 })] },
  { id: 'logo', act: 3, mood: 'calido', layout: 'logo', dur: 6, voz: '(Silencio. Solo música.)', lines: [] },
];

// =====================================================================
//  TIEMPOS
//  Ahora: estimación por palabras (≈2,5 palabras/s + respiración).
//  Con el audio real: TIEMPOS_REALES[id] = { t0, t1, palabras: [t de cada palabra] }
// =====================================================================
const TIEMPOS_REALES = {};
const PAL_SEG = 2.5, RESPIRO = 1.0, INICIO = 1.2;
(function () {
  let t = INICIO;
  for (const sc of SCENES) {
    const n = words(sc.voz).length;
    const dur = sc.dur ?? Math.max(3.6, n / PAL_SEG + RESPIRO);
    const real = TIEMPOS_REALES[sc.id];
    sc.t0 = real ? real.t0 : t;
    sc.t1 = real ? real.t1 : t + dur;
    sc.speak = Math.max(0.5, sc.t1 - sc.t0 - RESPIRO);
    sc.n = n;
    // momento en que aparece cada línea = cuando Allan dice la palabra `k`
    sc.lines.forEach((l, i) => {
      let wi = 0;
      if (l.k) {
        const idx = sc.voz.toLowerCase().indexOf(l.k.toLowerCase());
        wi = idx >= 0 ? words(sc.voz.slice(0, idx)).length : 0;
      }
      l.wi = wi;
      l.tIn = real?.palabras ? real.palabras[wi] : sc.t0 + (n ? wi / n : 0) * sc.speak + (l.k ? 0 : i * 0.15);
    });
    t = sc.t1;
  }
})();
const DUR = SCENES[SCENES.length - 1].t1 + 0.6;
const byId = Object.fromEntries(SCENES.map(s => [s.id, s]));
const OVER = 0.35;
const MEDIA = {}; window.MEDIA = MEDIA;   // id -> imagen / vídeo (o array de vídeos)

// =====================================================================
//  texto
// =====================================================================
function fontOf(l) {
  if (l.f === 'italic') return `italic 400 ${l.s}px CormI`;
  if (l.f === 'sans') return `500 ${l.s}px Mont`;
  return `400 ${l.s}px Corm`;
}
const spacingOf = l => l.f === 'sans' ? l.s * 0.38 : 0;
function measure(l) {
  ctx.font = fontOf(l); const sp = spacingOf(l);
  return l.text.split(' ').reduce((a, w) => a + ctx.measureText(w).width + sp * w.length, 0) + ctx.measureText(' ').width * (l.text.split(' ').length - 1);
}
// align: 'center' | 'left'
function drawLine(l, x, cy, tIn, tOut, t, align = 'center') {
  ctx.font = fontOf(l);
  const sp = spacingOf(l);
  const ws = l.text.split(' ');
  const spaceW = ctx.measureText(' ').width;
  const wW = ws.map(w => ctx.measureText(w).width + sp * w.length);
  const total = wW.reduce((a, b) => a + b, 0) + spaceW * (ws.length - 1);
  let xx0 = align === 'center' ? x - total / 2 : x;
  const out = ramp(t, tOut - 0.7, tOut + OVER);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ws.forEach((w, i) => {
    const k = easeOut(ramp(t, tIn + i * 0.08, tIn + i * 0.08 + 0.9));
    const a = k * (1 - out);
    if (a > 0.003) {
      ctx.save();
      ctx.globalAlpha *= a;
      const blur = (1 - k) * 14 + out * 10;
      if (blur > 0.3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
      ctx.fillStyle = l.c;
      ctx.shadowColor = l.c === GOLD ? 'rgba(226,197,139,.5)' : 'rgba(0,0,0,.7)';
      ctx.shadowBlur = 26;
      const y = cy + (1 - k) * 22 - out * 14;
      if (sp) { let xx = xx0; for (const ch of w) { ctx.fillText(ch, xx, y); xx += ctx.measureText(ch).width + sp; } }
      else ctx.fillText(w, xx0, y);
      ctx.restore();
    }
    xx0 += wW[i] + spaceW;
  });
}
function drawBlock(sc, t, x, cy, align = 'center', lines = sc.lines) {
  const hs = lines.map(l => l.s * 1.2 + (l.gap || 0));
  let y = cy - hs.reduce((a, b) => a + b, 0) / 2;
  lines.forEach(l => { y += l.gap || 0; drawLine(l, x, y + l.s * .6, l.tIn, sc.t1, t, align); y += l.s * 1.2; });
}
const sceneAlpha = (sc, t) => ramp(t, sc.t0 - .2, sc.t0 + .8) * (1 - ramp(t, sc.t1 - .4, sc.t1 + OVER + .4));

// =====================================================================
//  media: imagen real o hueco de maqueta
// =====================================================================
function placeholder(x, y, w, h, title, sub) {
  ctx.save();
  ctx.fillStyle = 'rgba(32,26,20,.72)'; ctx.fillRect(x, y, w, h);
  ctx.setLineDash([12, 9]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(226,197,139,.8)'; ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `500 ${Math.max(16, Math.min(30, w / 18))}px Mont`; ctx.fillStyle = GOLD;
  ctx.fillText(title, x + w / 2, y + h / 2 - (sub ? 22 : 0));
  if (sub) { ctx.font = `italic 400 ${Math.max(18, Math.min(38, w / 16))}px CormI`; ctx.fillStyle = IVORY; ctx.fillText(sub, x + w / 2, y + h / 2 + 24); }
  ctx.restore();
}
function drawCover(el, x, y, w, h, z = 1, dx = 0, filter = 'none') {
  const iw = el.naturalWidth || el.videoWidth, ih = el.naturalHeight || el.videoHeight;
  const s = Math.max(w / iw, h / ih) * z;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.filter = filter;
  ctx.drawImage(el, x + w / 2 - iw * s / 2 + dx, y + h / 2 - ih * s / 2, iw * s, ih * s);
  ctx.restore();
}
const ready = el => el && (el.naturalWidth || el.videoWidth);

// =====================================================================
//  LAYOUTS
// =====================================================================
const LAYOUT = {
  centro(sc, t) { drawBlock(sc, t, W / 2, H / 2); },

  // foto que entra de lado con máscara + texto alineado a la izquierda
  split(sc, t) {
    const a = sceneAlpha(sc, t), k = easeOut(ramp(t, sc.t0, sc.t0 + 1.4)), p = ramp(t, sc.t0, sc.t1 + 1);
    const cw = 640, ch = 800, cx = 1130 + (1 - k) * 90, cy = 140;
    ctx.save(); ctx.globalAlpha = a;
    // halo
    const g = ctx.createRadialGradient(cx + cw / 2, cy + ch / 2, 50, cx + cw / 2, cy + ch / 2, 620);
    g.addColorStop(0, 'rgba(226,197,139,.16)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // máscara que se abre de abajo a arriba
    ctx.beginPath(); ctx.rect(cx, cy + ch * (1 - k), cw, ch * k); ctx.clip();
    const el = MEDIA[sc.id];
    if (ready(el)) drawCover(el, cx, cy, cw, ch, lerp(1.12, 1.02, p), 0, 'sepia(.2) brightness(.85)');
    else placeholder(cx, cy, cw, ch, 'FOTO' + (sc.media.opcional ? ' · OPCIONAL' : ''), sc.media.etiqueta);
    ctx.restore();
    ctx.save(); ctx.globalAlpha = a * k; ctx.strokeStyle = 'rgba(226,197,139,.55)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(cx + 18, cy + 18, cw, ch); ctx.restore();
    drawBlock(sc, t, 170, H / 2, 'left');
  },

  // la foto de la abuela como polaroid, con luz cálida detrás
  polaroid(sc, t) {
    const a = sceneAlpha(sc, t), k = easeOut(ramp(t, sc.t0, sc.t0 + 1.8)), p = ramp(t, sc.t0, sc.t1 + 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(620, 540 + (1 - k) * 60); ctx.rotate(lerp(-0.09, -0.035, k));
    const g = ctx.createRadialGradient(0, 0, 40, 0, 0, 560);
    g.addColorStop(0, `rgba(255,220,160,${.28 * k})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(-700, -700, 1400, 1400);
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 50;
    ctx.fillStyle = '#efe6d6'; ctx.fillRect(-270, -330, 540, 640);
    ctx.shadowBlur = 0;
    const el = MEDIA[sc.id];
    if (ready(el)) drawCover(el, -240, -300, 480, 500, lerp(1.08, 1.0, p), 0, 'sepia(.35) brightness(.95)');
    else placeholder(-240, -300, 480, 500, 'FOTO', sc.media.etiqueta);
    ctx.restore();
    drawBlock(sc, t, 1060, H / 2, 'left');
  },

  // dos fuerzas en equilibrio: ganas / miedo
  balanza(sc, t) {
    const a = sceneAlpha(sc, t), k = easeOut(ramp(t, sc.t0, sc.t0 + 1.2));
    const l2 = sc.lines[1].tIn;
    const tilt = Math.sin(t * 1.1) * 0.035 + (ramp(t, l2, l2 + 1.5) - .5) * 0.05;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 640);
    ctx.strokeStyle = 'rgba(226,197,139,.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(0, 170); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -66, 7, 0, 7); ctx.fillStyle = GOLD; ctx.fill();
    ctx.rotate(tilt);
    const half = 420 * k;
    ctx.beginPath(); ctx.moveTo(-half, -60); ctx.lineTo(half, -60); ctx.stroke();
    [[-1, 'GANAS', sc.lines[0].tIn], [1, 'MIEDO', l2]].forEach(([s, txt, ti]) => {
      const kk = easeOut(ramp(t, ti, ti + 1));
      ctx.save(); ctx.translate(s * half, -60); ctx.rotate(-tilt);
      ctx.globalAlpha = a * kk;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 90); ctx.stroke();
      const r = 70 + 6 * Math.sin(t * 2 + s);
      const g = ctx.createRadialGradient(0, 160, 0, 0, 160, r * 1.6);
      g.addColorStop(0, s < 0 ? 'rgba(255,220,150,.45)' : 'rgba(140,150,200,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(-200, 0, 400, 340);
      ctx.beginPath(); ctx.arc(0, 160, r, 0, 7); ctx.stroke();
      ctx.font = '500 30px Mont'; ctx.fillStyle = s < 0 ? GOLD : SOFT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.letterSpacing = '10px'; ctx.fillText(txt, 5, 160); ctx.letterSpacing = '0px';
      ctx.restore();
    });
    ctx.restore();
    drawBlock(sc, t, W / 2, 270);
  },

  // las dudas flotan a distintas profundidades y luego se disuelven
  dudas(sc, t) {
    sc.lines.forEach((l, i) => {
      const drift = Math.sin(t * .4 + i * 2) * 14;
      ctx.save();
      const depth = [1, .9, 1.05][i];
      ctx.translate(l.x, l.y + drift); ctx.scale(depth, depth); ctx.translate(-l.x, -l.y - drift);
      drawLine(l, l.x, l.y + drift, l.tIn, sc.t1, t);
      ctx.restore();
    });
  },

  // vitral de iglesia muy tenue (recuerdo de infancia)
  vitral(sc, t) {

  const lw = 260 * easeOut(ramp(t, t0 + 1.2, t0 + 2.8));
  ctx.fillStyle = GOLD_D; ctx.globalAlpha = a;
  ctx.fillRect(W / 2 - 40 - lw - 150, H / 2 + 62, lw, 1.5); ctx.fillRect(W / 2 + 190, H / 2 + 62, lw, 1.5);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = a;
  drawLine(L('MÉDIUM', 'sans', 38, IVORY), W / 2, H / 2 + 62, t0 + 1.4, 999, t);
  drawLine(L('Bienvenidos.', 'italic', 64, GOLD), W / 2, H / 2 + 190, t0 + 3.0, 999, t);
  ctx.restore();
}

function renderFrame(t) {
  ctx.save();
  background(t);
  const z = 1 + .01 * Math.sin(t * .25);
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  for (const sc of SCENES) if (t > sc.t0 - .6 && t < sc.t1 + OVER + .6) LAYOUT[sc.layout](sc, t);
  ctx.restore();
  timeline(t);
  overlays(t);
}
window.renderFrame = renderFrame; window.DUR = DUR; window.SCENES = SCENES;

// =====================================================================
//  reproducción en directo
// =====================================================================
const voz = document.getElementById('voz'), music = document.getElementById('music');
let tStart = null;
function loop() { const t = (performance.now() - tStart) / 1000; renderFrame(Math.min(t, DUR)); if (t < DUR) requestAnimationFrame(loop); }
document.getElementById('start').onclick = async () => {
  document.getElementById('start').remove();
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  tStart = performance.now(); music.volume = 0.3;
  voz.play().catch(() => {}); music.play().catch(() => {});
  loop();
};
window.fontsReady = Promise.all(['400 40px Corm', '300 40px Corm', 'italic 400 40px CormI', '400 40px Mont', '500 40px Mont'].map(f => document.fonts.load(f))).then(() => document.fonts.ready);
window.fontsReady.then(() => renderFrame(0));
</script>
