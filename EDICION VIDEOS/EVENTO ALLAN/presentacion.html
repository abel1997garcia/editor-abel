<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Allan García · Presentación</title>
<style>
  @font-face { font-family: 'Corm'; src: url('fonts/corm.ttf'); font-weight: 300 700; }
  @font-face { font-family: 'CormI'; src: url('fonts/cormi.ttf'); font-weight: 300 700; font-style: italic; }
  @font-face { font-family: 'Mont'; src: url('fonts/mont.ttf'); font-weight: 100 900; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #cdb98f; font: 300 22px 'Mont', sans-serif; letter-spacing: .3em; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="start">CLIC PARA EMPEZAR</div>
<audio id="voz" src="voz_allan.mp3" preload="auto"></audio>
<audio id="music" src="musica.mp3" preload="auto"></audio>
<script>
// ---------- utilidades ----------
const W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const ramp = (t, a, b) => clamp((t - a) / (b - a));
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

// ---------- paleta ----------
const IVORY = '#F5EEDF', GOLD = '#E2C58B', GOLD_D = '#B8955A', MUTED = '#A9A39A';
const MOODS = {
  frio:   { c: [40, 60, 120],  i: .55 },
  sombra: { c: [70, 40, 90],   i: .45 },
  oscuro: { c: [90, 30, 50],   i: .38 },
  calido: { c: [200, 160, 90], i: .85 },
  luz:    { c: [200, 165, 105], i: 1 },
};

// ---------- GUION ----------
// Allan habla en primera persona, de tú a tú.
// voz: lo que dice Allan (marca la duración de la escena).
// lines: lo que se lee en pantalla (frase clave, no todo el texto).
// media: hueco para FOTO o VÍDEO. Si no hay src se pinta el hueco (maqueta).
const L = (text, f = 'serif', s = 84, c = IVORY, gap = 0) => ({ text, f, s, c, gap });
const SCENES = [
  { id: 'intro', mood: 'frio',
    voz: 'Si estás aquí, es probable que hayas perdido a alguien que querías.',
    lines: [L('Si estás aquí…', 'serif', 100), L('es probable que hayas perdido a alguien que querías.', 'italic', 66, GOLD, 10)] },
  { id: 'algo-por-decir', mood: 'frio',
    voz: 'Y quizá te quedaste con algo por decirle.',
    lines: [L('Y quizá te quedaste', 'serif', 90), L('con algo por decirle.', 'italic', 104, GOLD)] },
  { id: 'mi-historia', mood: 'frio',
    voz: 'Yo también me sentí perdido durante mucho tiempo. Déjame contarte mi historia.',
    lines: [L('DÉJAME CONTARTE MI HISTORIA', 'sans', 40, IVORY), L('Allan', 'serif', 210, IVORY, 18)] },
  { id: 'antes', mood: 'frio',
    voz: 'Yo tenía un trabajo estable. Un buen sueldo. Desde fuera, mi vida parecía perfecta.',
    media: { tipo: 'foto', etiqueta: 'Allan en su vida de antes (trabajo, etapa "perfecta")' },
    lines: [L('Tenía un trabajo estable. Un buen sueldo.', 'serif', 78), L('Desde fuera, mi vida parecía perfecta.', 'italic', 88, GOLD)] },
  { id: 'cuerpo', mood: 'sombra',
    voz: 'Pero por dentro algo no encajaba. Y mi cuerpo empezó a avisarme de que ese no era mi camino.',
    lines: [L('Pero por dentro algo no encajaba.', 'serif', 84), L('Mi cuerpo me avisaba: ese no era mi camino.', 'italic', 84, GOLD)] },
  { id: 'infierno', mood: 'oscuro',
    voz: 'No te voy a mentir: he estado en el infierno durante muchos años.',
    lines: [L('«He estado en el infierno', 'italic', 104), L('durante muchos años.»', 'italic', 104)] },
  { id: 'sueno', mood: 'sombra',
    voz: 'Hasta que una noche… soñé con mi abuela.',
    media: { tipo: 'foto', etiqueta: 'Su abuela (la foto más importante del vídeo)' },
    lines: [L('Hasta que una noche…', 'serif', 90), L('soñé con mi abuela.', 'italic', 112, GOLD)] },
  { id: 'te-ayudare', mood: 'calido', fx: 'destello',
    voz: 'Me miró y me dijo: «Te voy a ayudar».',
    lines: [L('ME MIRÓ Y ME DIJO:', 'sans', 40, IVORY), L('«Te voy a ayudar.»', 'italic', 156, IVORY, 18)] },
  { id: 'el-don', mood: 'luz',
    voz: 'Desde ese día, poco a poco, entendí que el don siempre había estado ahí. Solo me faltaba atreverme a escucharlo.',
    media: { tipo: 'foto', etiqueta: 'Allan en sus inicios o en su santuario (Arcángel San Miguel)', opcional: true },
    lines: [L('Poco a poco entendí', 'serif', 80), L('que el don siempre había estado ahí.', 'italic', 100, GOLD)] },
  { id: 'decision', mood: 'luz',
    voz: 'Así que dejé la seguridad… y elegí escuchar a mi alma.',
    lines: [L('Dejé la seguridad.', 'serif', 96), L('Elegí escuchar a mi alma.', 'italic', 106, GOLD)] },
  { id: 'desde-entonces', mood: 'luz',
    voz: 'Y desde entonces he vivido momentos que todavía hoy me emocionan.',
    lines: [L('Desde entonces he vivido momentos', 'serif', 80), L('que todavía hoy me emocionan.', 'italic', 100, GOLD)] },
  { id: 'prueba', mood: 'luz', dur: 22,
    voz: '(Audio original de las sesiones: Allan da un dato concreto y la persona lo confirma. 3 momentos de 6-7 s.)',
    media: { tipo: 'video', etiqueta: 'Recopilatorio de sesiones: 3 momentos «dato → la persona lo confirma»' },
    lines: [], caption: 'SESIONES REALES' },
  { id: 'cifra', mood: 'luz', fx: 'contador',
    voz: 'Más de mil doscientas sesiones.', lines: [] },
  { id: 'madres', mood: 'luz',
    voz: 'He visto a madres volver a escuchar a sus hijos.',
    media: { tipo: 'video', etiqueta: 'Cara de una madre emocionada (del recopilatorio)', opcional: true },
    lines: [L('He visto a madres volver a escuchar', 'serif', 80), L('a sus hijos.', 'italic', 104, GOLD)] },
  { id: 'hijos', mood: 'luz',
    voz: 'A hijos despedirse por fin de sus padres.',
    lines: [L('A hijos despedirse por fin', 'serif', 84), L('de sus padres.', 'italic', 104, GOLD)] },
  { id: 'nietos', mood: 'luz',
    voz: 'A nietos sentir otra vez el cariño de sus abuelos.',
    lines: [L('A nietos sentir otra vez', 'serif', 84), L('el cariño de sus abuelos.', 'italic', 104, GOLD)] },
  { id: 'amor', mood: 'luz',
    voz: 'Porque el amor no muere. Solo cambia de lugar.',
    lines: [L('Porque el amor no muere.', 'serif', 104), L('Solo cambia de lugar.', 'italic', 112, GOLD)] },
  { id: 'tu', mood: 'calido',
    voz: 'Y si hoy estás aquí, quizá alguien al otro lado también quiere que le escuches.',
    lines: [L('Quizá alguien al otro lado', 'serif', 90), L('también quiere que le escuches.', 'italic', 100, GOLD)] },
  { id: 'mision', mood: 'calido',
    voz: 'Mi misión es que te llegue su abrazo desde el otro lado.',
    lines: [L('Mi misión es que te llegue su abrazo', 'serif', 80), L('desde el otro lado.', 'italic', 112, GOLD)] },
  { id: 'logo', mood: 'calido', fx: 'logo', dur: 7,
    voz: '(Silencio. Solo música.)', lines: [] },
];

// ---------- TIEMPOS ----------
// Ahora: estimados por la velocidad de habla (≈2,4 palabras/s + respiración).
// Cuando llegue el audio de Allan: rellenar TIEMPOS_REALES { id: [inicio, fin] } con su voz.
const TIEMPOS_REALES = {};
const PAL_SEG = 2.4, RESPIRO = 1.1, INICIO = 1.2;
(function calcularTiempos() {
  let t = INICIO;
  for (const sc of SCENES) {
    const palabras = sc.voz.replace(/\(.*?\)/g, '').split(/\s+/).filter(Boolean).length;
    const dur = sc.dur ?? Math.max(3.6, palabras / PAL_SEG + RESPIRO);
    const real = TIEMPOS_REALES[sc.id];
    sc.t0 = real ? real[0] : t;
    sc.t1 = real ? real[1] : t + dur;
    t = sc.t1;
  }
})();
const DUR = SCENES[SCENES.length - 1].t1 + 0.6;
const sceneById = Object.fromEntries(SCENES.map(s => [s.id, s]));
// las escenas se solapan un poco para que el texto saliente y el entrante crucen
const OVER = 0.35;

// ---------- media (fotos / vídeo) ----------
const MEDIA = {};   // id -> HTMLImageElement | HTMLVideoElement (en la versión final)
window.MEDIA = MEDIA;

function fontOf(l) {
  if (l.f === 'italic') return `italic 400 ${l.s}px CormI`;
  if (l.f === 'sans') return `400 ${l.s}px Mont`;
  return `400 ${l.s}px Corm`;
}
function spacingOf(l) { return l.f === 'sans' ? l.s * 0.42 : 0; }

// Línea con revelado palabra a palabra (blur + subida)
function drawLine(l, cx, cy, tIn, tOut, t) {
  ctx.font = fontOf(l);
  const sp = spacingOf(l);
  const words = l.text.split(' ');
  const spaceW = ctx.measureText(' ').width;
  const wW = words.map(w => ctx.measureText(w).width + sp * w.length);
  const total = wW.reduce((a, b) => a + b, 0) + spaceW * (words.length - 1);
  let x = cx - total / 2;
  const out = ramp(t, tOut - 0.7, tOut + OVER);
  words.forEach((w, i) => {
    const k = easeOut(ramp(t, tIn + i * 0.09, tIn + i * 0.09 + 0.9));
    const a = k * (1 - out);
    if (a > 0.003) {
      ctx.save();
      ctx.globalAlpha = a;
      const blur = (1 - k) * 14 + out * 10;
      if (blur > 0.3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
      ctx.fillStyle = l.c;
      ctx.shadowColor = l.c === GOLD ? 'rgba(226,197,139,.55)' : 'rgba(0,0,0,.6)';
      ctx.shadowBlur = 28;
      const y = cy + (1 - k) * 22 - out * 14;
      if (sp) { let xx = x; for (const ch of w) { ctx.fillText(ch, xx, y); xx += ctx.measureText(ch).width + sp; } }
      else ctx.fillText(w, x, y);
      ctx.restore();
    }
    x += wW[i] + spaceW;
  });
}

function sceneAlpha(sc, t) { return ramp(t, sc.t0 - .2, sc.t0 + .8) * (1 - ramp(t, sc.t1 - .4, sc.t1 + OVER + .4)); }

// Foto/vídeo a pantalla completa con Ken Burns, o el hueco si aún no hay material
function drawMedia(sc, t) {
  const m = sc.media; if (!m) return;
  const a = sceneAlpha(sc, t); if (a <= 0) return;
  const k = ramp(t, sc.t0, sc.t1);
  const el = MEDIA[sc.id];
  ctx.save(); ctx.globalAlpha = a;
  if (el && (el.naturalWidth || el.videoWidth)) {
    const iw = el.naturalWidth || el.videoWidth, ih = el.naturalHeight || el.videoHeight;
    const z = m.tipo === 'foto' ? lerp(1.02, 1.10, k) : 1;
    const s = Math.max(W / iw, H / ih) * z;
    ctx.filter = m.tipo === 'foto' ? 'sepia(.25) brightness(.62) contrast(1.05)' : 'brightness(.9)';
    ctx.drawImage(el, W / 2 - iw * s / 2 + lerp(-20, 20, k), H / 2 - ih * s / 2, iw * s, ih * s);
    ctx.filter = 'none';
  } else {
    // HUECO (maqueta)
    const pad = 70;
    ctx.fillStyle = 'rgba(30,24,18,.55)'; ctx.fillRect(pad, pad, W - pad * 2, H - pad * 2);
    ctx.setLineDash([14, 10]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(226,197,139,.75)';
    ctx.strokeRect(pad, pad, W - pad * 2, H - pad * 2); ctx.setLineDash([]);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '500 34px Mont'; ctx.fillStyle = GOLD;
    ctx.fillText((m.tipo === 'foto' ? 'FOTO' : 'VÍDEO') + (m.opcional ? ' (OPCIONAL)' : ''), W / 2, 180);
    ctx.font = 'italic 400 46px CormI'; ctx.fillStyle = IVORY;
    ctx.fillText(m.etiqueta, W / 2, 240);
  }
  ctx.restore();
  // degradado inferior para que el texto respire encima de la imagen
  const g = ctx.createLinearGradient(0, H * .35, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${.75 * a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawScene(sc, t) {
  if (t < sc.t0 - 0.3 || t > sc.t1 + OVER + 0.5) return;
  if (sc.fx === 'contador') return drawCounter(sc, t);
  if (sc.fx === 'logo') return finale(sc, t);
  if (sc.caption) {
    ctx.save(); ctx.globalAlpha = sceneAlpha(sc, t);
    drawLine(L(sc.caption, 'sans', 30, IVORY), W / 2, H - 110, sc.t0 + .3, sc.t1, t);
    ctx.restore();
  }
  const heights = sc.lines.map(l => l.s * 1.18 + l.gap);
  const total = heights.reduce((a, b) => a + b, 0);
  // con foto/vídeo el texto baja al tercio inferior
  const cy = sc.media ? H * 0.74 : H / 2;
  let y = cy - total / 2;
  ctx.textBaseline = 'middle';
  sc.lines.forEach((l, i) => {
    y += l.gap;
    drawLine(l, W / 2, y + l.s * 0.59, sc.t0 + i * 0.6, sc.t1, t);
    y += l.s * 1.18;
  });
}

function drawCounter(sc, t) {
  const k = easeOut(ramp(t, sc.t0 + 0.1, sc.t0 + 2.2));
  const a = ramp(t, sc.t0 - .2, sc.t0 + 0.6) * (1 - ramp(t, sc.t1 - 0.5, sc.t1 + OVER));
  const n = Math.round(1200 * k);
  const txt = '+' + (n >= 1000 ? Math.floor(n / 1000) + '.' + String(n % 1000).padStart(3, '0') : n);
  ctx.save();
  ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '300 230px Corm';
  ctx.fillStyle = GOLD; ctx.shadowColor = 'rgba(226,197,139,.6)'; ctx.shadowBlur = 40;
  ctx.fillText(txt, W / 2, H / 2 - 60);
  ctx.shadowBlur = 0;
  const lw = 520 * easeOut(ramp(t, sc.t0 + 0.4, sc.t0 + 1.8));
  ctx.fillStyle = GOLD_D; ctx.fillRect(W / 2 - lw / 2, H / 2 + 70, lw, 1.5);
  ctx.restore();
  ctx.textBaseline = 'middle';
  drawLine(L('SESIONES', 'sans', 42, IVORY), W / 2, H / 2 + 130, sc.t0 + 0.7, sc.t1, t);
  drawLine(L('con seres queridos y guías espirituales.', 'italic', 54, MUTED), W / 2, H / 2 + 210, sc.t0 + 1.2, sc.t1, t);
}

// ---------- fondo / motion ----------
const R = rng(7);
const PARTS = Array.from({ length: 260 }, () => ({
  x: R() * W, y: R() * H, z: 0.3 + R() * 1.4, ph: R() * 6.28, sp: 6 + R() * 22, tw: 0.5 + R() * 2,
}));
const NEB = [{ x: .30, y: .35, r: .55, ph: 0 }, { x: .72, y: .62, r: .6, ph: 2 }, { x: .5, y: .5, r: .45, ph: 4 }];
const grain = document.createElement('canvas'); grain.width = grain.height = 512;
{ const g = grain.getContext('2d'), im = g.createImageData(512, 512), r = rng(3);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); }

// atmósfera: interpola el "mood" de cada escena
function mood(t) {
  let i = 0; while (i < SCENES.length - 1 && t > SCENES[i + 1].t0) i++;
  const a = MOODS[SCENES[i].mood], nx = SCENES[i + 1];
  if (!nx) return a;
  const b = MOODS[nx.mood];
  const k = ease(ramp(t, nx.t0 - 1.5, nx.t0 + .5));
  return { c: a.c.map((v, j) => Math.round(lerp(v, b.c[j], k))), i: lerp(a.i, b.i, k) };
}

const T_DESTELLO = () => sceneById['te-ayudare'].t0 + 0.5;
const T_LUZ = () => sceneById['el-don'].t0 - 0.5;

function background(t) {
  const m = mood(t);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05070f'); g.addColorStop(1, '#020205');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  NEB.forEach((n, i) => {
    const x = (n.x + Math.sin(t * .05 + n.ph) * .06) * W, y = (n.y + Math.cos(t * .04 + n.ph) * .05) * H;
    const r = n.r * W * (1 + .05 * Math.sin(t * .2 + i));
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    const [cr, cg, cb] = m.c;
    rg.addColorStop(0, `rgba(${cr},${cg},${cb},${.22 * m.i})`);
    rg.addColorStop(.5, `rgba(${cr * .6 | 0},${cg * .6 | 0},${cb * .7 | 0},${.08 * m.i})`);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  });
  const tl = T_LUZ(), td = T_DESTELLO();
  const rays = ramp(t, tl, tl + 5) * (1 - ramp(t, DUR - 6, DUR));
  if (rays > 0) {
    ctx.save(); ctx.translate(W / 2, -200);
    for (let i = 0; i < 9; i++) {
      const ang = -0.55 + i * 0.137 + Math.sin(t * .15 + i) * .03;
      ctx.save(); ctx.rotate(ang);
      const lg = ctx.createLinearGradient(0, 0, 0, 1500);
      lg.addColorStop(0, `rgba(255,225,170,${.10 * rays})`); lg.addColorStop(1, 'rgba(255,225,170,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.lineTo(90 + i * 6, 1500); ctx.lineTo(-90 - i * 6, 1500); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  const ts = sceneById['sueno'].t0;
  const orb = (.25 + .35 * ramp(t, ts, td) + .4 * ramp(t, td - .5, td + 1)) * (1 - .5 * ramp(t, DUR - 5, DUR));
  const or = 380 + 260 * ramp(t, ts, td + 2);
  const og = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, or);
  og.addColorStop(0, `rgba(255,232,190,${.13 * orb})`); og.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = og; ctx.fillRect(0, 0, W, H);
  const rg2 = ramp(t, tl, tl + 6) * (1 - ramp(t, DUR - 8, DUR - 5));
  if (rg2 > 0) {
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.strokeStyle = `rgba(226,197,139,${.07 * rg2})`; ctx.lineWidth = 1.2;
    for (let i = 0; i < 6; i++) {
      const a = t * .03 + i * Math.PI / 3;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 170, Math.sin(a) * 170, 170, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, 340, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 470 + Math.sin(t * .3) * 6, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  const energy = .55 + .25 * ramp(t, ts, td) + .5 * ramp(t, td, td + 4);
  PARTS.forEach(p => {
    const y = ((p.y - t * p.sp * p.z * energy) % H + H) % H;
    const x = p.x + Math.sin(t * .3 + p.ph) * 30 * p.z;
    const tw = .45 + .55 * Math.sin(t * p.tw + p.ph);
    const a = clamp(tw * .7 * p.z * energy * m.i, 0, 1);
    const r = 1.1 * p.z + (p.z > 1.3 ? 1.2 : 0);
    const pg = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
    pg.addColorStop(0, `rgba(255,236,200,${a})`); pg.addColorStop(1, 'rgba(255,236,200,0)');
    ctx.fillStyle = pg; ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
  });
  ctx.globalCompositeOperation = 'source-over';
}

function overlays(t) {
  const flash = Math.exp(-Math.pow((t - T_DESTELLO()) / 0.45, 2)) * .5;
  if (flash > .01) { ctx.fillStyle = `rgba(255,240,215,${flash})`; ctx.fillRect(0, 0, W, H); }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.78)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay';
  ctx.translate(-((t * 977) % 512), -((t * 613) % 512));
  ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.fillRect(0, 0, W + 512, H + 512);
  ctx.restore();
  const fade = 1 - ramp(t, 0, 1.2) * (1 - ramp(t, DUR - 1.4, DUR));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

function finale(sc, t) {
  const t0 = sc.t0;
  const a = 1 - ramp(t, DUR - 1.6, DUR - .2);
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const k = easeOut(ramp(t, t0, t0 + 2.6));
  const name = 'ALLAN GARCÍA';
  ctx.font = '400 128px Corm';
  const sp = lerp(70, 26, k);
  const ws = [...name].map(c => ctx.measureText(c).width);
  const tw = ws.reduce((x, y) => x + y, 0) + sp * (name.length - 1);
  let x = W / 2 - tw / 2;
  const gg = ctx.createLinearGradient(W / 2 - tw / 2, 0, W / 2 + tw / 2, 0);
  gg.addColorStop(0, GOLD_D); gg.addColorStop(.5, '#FFF1D2'); gg.addColorStop(1, GOLD_D);
  ctx.filter = `blur(${((1 - k) * 12).toFixed(1)}px)`;
  ctx.fillStyle = gg; ctx.shadowColor = 'rgba(226,197,139,.6)'; ctx.shadowBlur = 36;
  ctx.globalAlpha = a * k;
  [...name].forEach((c, i) => { ctx.fillText(c, x + ws[i] / 2, H / 2 - 40); x += ws[i] + sp; });
  ctx.filter = 'none'; ctx.shadowBlur = 0;
  const lw = 260 * easeOut(ramp(t, t0 + 1.2, t0 + 2.8));
  ctx.fillStyle = GOLD_D; ctx.globalAlpha = a;
  ctx.fillRect(W / 2 - 40 - lw - 150, H / 2 + 62, lw, 1.5); ctx.fillRect(W / 2 + 190, H / 2 + 62, lw, 1.5);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = a;
  drawLine(L('MÉDIUM', 'sans', 40, IVORY), W / 2, H / 2 + 62, t0 + 1.4, 999, t);
  drawLine(L('Bienvenidos.', 'italic', 64, GOLD), W / 2, H / 2 + 190, t0 + 3.0, 999, t);
  ctx.restore();
}

function renderFrame(t) {
  ctx.save();
  ctx.textAlign = 'left';
  background(t);
  SCENES.forEach(sc => drawMedia(sc, t));
  const z = 1 + .012 * Math.sin(t * .25);
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  SCENES.forEach(sc => drawScene(sc, t));
  ctx.restore();
  overlays(t);
}
window.renderFrame = renderFrame;
window.DUR = DUR;
window.SCENES = SCENES;

// ---------- reproducción en directo ----------
const voz = document.getElementById('voz'), music = document.getElementById('music');
let t0 = null;
function loop() {
  const t = (performance.now() - t0) / 1000;
  renderFrame(Math.min(t, DUR));
  if (t < DUR) requestAnimationFrame(loop);
}
document.getElementById('start').onclick = async () => {
  document.getElementById('start').remove();
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  t0 = performance.now();
  music.volume = 0.35;
  voz.play().catch(() => {}); music.play().catch(() => {});
  loop();
};
window.fontsReady = Promise.all(['400 40px Corm', '300 40px Corm', 'italic 400 40px CormI', '400 40px Mont', '500 40px Mont'].map(f => document.fonts.load(f))).then(() => document.fonts.ready);
window.fontsReady.then(() => renderFrame(0));
</script>
